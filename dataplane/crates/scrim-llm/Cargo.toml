# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "scrim-llm"
description = "scrim LLM proxy: base-URL listener, provider codecs, fail-closed redaction and streaming placeholder restore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Test doubles (fake redactor, guard, placeholders, policy, audit sink, recording upstream).
# Used by this crate's tests and benches and by downstream integration tests. Never enable in
# a release build.
test-util = ["dep:aho-corasick", "dep:getrandom"]
# InterceptHandler adapter for scrim-toolproxy: provider hosts reached through the forward
# proxy (HTTPS_PROXY) are served by this crate.
intercept = ["dep:scrim-toolproxy"]
# The production engine: scrim-redact behind the engine traits (`core::CoreEngine`).
redact = ["dep:scrim-redact"]

[dependencies]
arc-swap = "1.7"
base64 = "0.23"
bytes = "1"
crc32fast = "1.5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.13"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots", "native-tokio", "logging"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "client-legacy", "http1", "http2"] }
memchr = "2.7"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "fs", "io-util", "macros"] }
tracing = "0.1"
webpki-roots = "1"
zeroize.workspace = true
scrim-metrics = { path = "../scrim-metrics" }
scrim-dns = { path = "../scrim-dns" }

scrim-toolproxy = { path = "../scrim-toolproxy", optional = true }
scrim-redact = { path = "../scrim-redact", optional = true }

# test-util only
aho-corasick = { version = "1.1", optional = true }
getrandom = { version = "0.4", optional = true }

[dev-dependencies]
proptest = "1"
rcgen = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "fs", "io-util", "macros", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
scrim-llm = { path = ".", features = ["test-util", "intercept", "redact"] }

[[bench]]
name = "latency_gate"
harness = false
required-features = ["test-util"]

[lints]
workspace = true
