# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "scrim-upstream-proxy"
description = "Outbound connections of the scrim data plane through an upstream HTTP CONNECT proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# A recording CONNECT proxy for tests (`testing::TestProxy`). Never in a release build.
test-util = []

[dependencies]
arc-swap.workspace = true
base64 = "0.23"
http = "1"
hyper = { version = "1", features = ["client"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
thiserror = "2"
tokio = { workspace = true, features = ["net", "time", "io-util", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tower-service = "0.3.3"
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
getrandom = "0.4"
scrim-upstream-proxy = { path = ".", features = ["test-util"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true
