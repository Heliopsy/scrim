[package]
name = "scrim-toolproxy"
description = "HTTPS tool proxy for scrim: credential injection toward bound hosts and response redaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aho-corasick = "1.1"
arc-swap = "1.7"
base64 = "0.23"
brotli = "9"
bytes = "1"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.13"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "server", "server-auto", "http1", "http2"] }
md-5 = "0.11"
memchr = "2"
percent-encoding = "2"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
ring = "0.17"
rustls-native-certs = "0.8"
scrim-proto = { path = "../scrim-proto" }
scrim-redact = { path = "../scrim-redact" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tower-service = "0.3"
tracing = "0.1"
x509-parser = "0.18"
zeroize.workspace = true
zstd = "0.14"

[dev-dependencies]
rustls-pemfile = "2"
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs"] }

[lints]
workspace = true
