[package]
name = "scrim-dns"
description = "Upstream name resolution for scrim that never resolves to scrim itself (DNS override mode)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4.3"
hyper-util = { version = "0.1.21", features = ["client-legacy", "tokio"] }
tokio = { workspace = true, features = ["net", "time", "io-util", "rt"] }
tower-service = "0.3.3"
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
