# SPDX-License-Identifier: AGPL-3.0-only

[package]
name = "scrim-redact"
description = "scrim redaction core: value dictionary, dual matchers, independent guard and stream restorer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aho-corasick = "1.1.5"
arc-swap = "1.9.5"
hmac = "0.13.0"
memchr = "2.8.3"
regex = { version = "1.13.2", default-features = false, features = ["std", "perf", "unicode-perl"] }
sha2 = "0.11.1"
subtle = "2.6.1"
zeroize = { workspace = true, features = ["std"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12.0"
serde_json = "1.0.154"
stats_alloc = "0.1.10"

[lints]
workspace = true

[[bench]]
name = "redact"
harness = false
