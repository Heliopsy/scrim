# SPDX-License-Identifier: AGPL-3.0-only

[package]
name = "scrim-redact"
description = "scrim redaction core: value dictionary, dual matchers, independent guard and stream restorer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aho-corasick = "1.1.5"
arc-swap = "1.9.5"
blake3 = "1.8.7"
brotli-decompressor = "6.4.0"
crc32fast = "1.5.5"
flate2 = "1.1.11"
hmac = "0.13.0"
memchr = "2.8.3"
regex = { version = "1.13.2", default-features = false, features = ["std", "perf", "unicode-perl"] }
sha2 = "0.11.1"
subtle = "2.6.1"
unicode-normalization = "0.1.26"
zeroize = { workspace = true, features = ["std"] }
zstd = { version = "0.14.5", default-features = false }

[features]
# Keeps the pre-optimisation guard next to the real one and exposes
# `Guard::agrees_with_oracle`, for the fuzz targets. Never enable in production.
oracle = []

[dev-dependencies]
brotli = "9.1.3"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12.0"
serde_json = "1.0.154"
stats_alloc = "0.1.10"

[lints]
workspace = true

[[bench]]
name = "redact"
harness = false
