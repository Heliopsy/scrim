[package]
name = "scrim-dataplane"
description = "The scrim data plane: LLM proxy, redactor, guard and tool proxy, run as a child of the control plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "scrim-dataplane"
path = "src/main.rs"

[dependencies]
scrim-proto.workspace = true
arc-swap.workspace = true
prost.workspace = true
rustix = { workspace = true, features = ["process", "mm", "fs", "std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
tokio-stream = { workspace = true, features = ["sync", "net"] }
tonic = { workspace = true, features = ["server", "router", "codegen"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "json", "env-filter", "std"] }
zeroize.workspace = true

[dev-dependencies]
tonic = { workspace = true, features = ["channel", "codegen"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
