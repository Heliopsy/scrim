[package]
name = "scrim-dataplane"
description = "The scrim data plane: LLM proxy, redactor, guard and tool proxy, run as a child of the control plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "scrim-dataplane"
path = "src/main.rs"

[dependencies]
scrim-proto.workspace = true
scrim-toolproxy = { path = "../scrim-toolproxy" }
scrim-llm = { path = "../scrim-llm", features = ["intercept", "redact"] }
scrim-redact = { path = "../scrim-redact" }
scrim-policy = { path = "../scrim-policy", features = ["llm"] }
scrim-metrics = { path = "../scrim-metrics" }
scrim-dns = { path = "../scrim-dns" }
scrim-upstream-proxy = { path = "../scrim-upstream-proxy" }
hmac = "0.13"
sha2 = "0.11"
http = "1"
rustls-pki-types = { version = "1.16.0", features = ["std"] }
arc-swap.workspace = true
prost.workspace = true
getrandom = "0.4"
rustix = { workspace = true, features = ["process", "mm", "fs", "net", "std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
tokio-stream = { workspace = true, features = ["sync", "net"] }
tonic = { workspace = true, features = ["server", "router", "codegen"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "json", "env-filter", "std"] }
zeroize.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
x509-parser = "0.18"

[dev-dependencies]
tonic = { workspace = true, features = ["channel", "codegen"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tower = { version = "0.5.3", features = ["util"] }
scrim-llm = { path = "../scrim-llm", features = ["test-util", "intercept", "redact"] }
scrim-upstream-proxy = { path = "../scrim-upstream-proxy", features = ["test-util"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
serde_json = "1"
tokio = { workspace = true, features = ["process", "io-util"] }

[lints]
workspace = true
