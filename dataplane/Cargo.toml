# SPDX-License-Identifier: AGPL-3.0-only
#
# The scrim data plane (design D1, D11): every crate under crates/ is a member.
# Shared package metadata, dependency versions and lints live here; crates
# opt in with `x.workspace = true`.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
repository = "https://github.com/heliopsy/scrim"
publish = false

[workspace.dependencies]
prost = "0.14.6"
tonic = { version = "0.14.9", default-features = false }
tonic-prost = "0.14.9"
zeroize = "1.9.2"

[workspace.lints.rust]
# Unsafe code needs a crate-level allow with a comment saying why; the data
# plane gets what it needs from rustix.
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the codebase's style more than they help.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# Lints that protect the hot path and the no-value-in-output rule.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
debug = false

# Tests and benches keep debug info but optimise dependencies, so property
# tests and fuzz smoke runs stay fast.
[profile.dev.package."*"]
opt-level = 2
