# markdownlint-cli2 reads the rules from .markdownlint.yaml; this file only
# says which Markdown is linted, so `npx markdownlint-cli2` locally and the CI
# job check the same files.
globs:
  - "**/*.md"
ignores:
  - "**/node_modules/**"
  - ".worktrees/**"
  - "target/**"
  - "dataplane/target/**"
  # OpenSpec's own agent prompts, written by `openspec init`/`update`.
  - ".claude/**"
  # Written by the benchmark harness.
  - "bench/*/results/**"
  # Generated by `just config-docs` from the settings registry, one line per
  # description.
  - "docs/configuration.md"
  # The OpenSpec change: specs and tasks follow OpenSpec's format and are
  # checked by `openspec validate --all --strict`.
  - "openspec/**"
