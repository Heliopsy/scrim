<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- A private session bus for tests only: anyone who reaches the TCP port
     can use it, so the test publishes it on 127.0.0.1 only. -->
<busconfig>
  <type>session</type>
  <listen>unix:path=/tmp/keyring-run/bus</listen>
  <listen>tcp:host=0.0.0.0,bind=*,port=7777,family=ipv4</listen>
  <auth>EXTERNAL</auth>
  <auth>ANONYMOUS</auth>
  <allow_anonymous/>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
