description: cargo publishing to crates.io (CARGO_REGISTRY_TOKEN)
tools: [cargo]
credentials:
  - name: token
    description: A crates.io API token.
    hosts: [crates.io]
    inject: ["header:Authorization"]
    required: true
env:
  CARGO_REGISTRY_TOKEN: '{{ placeholder "token" }}'
paths:
  - home: .cargo/credentials.toml
  - home: .cargo/credentials
notes:
  - Alternative registries read CARGO_REGISTRIES_<NAME>_TOKEN; declare it in a tool-profiles override with the registry's name.
