apiVersion: v1
kind: Pod
metadata:
  name: scrim-test-llm
  namespace: scrim
  labels:
    helm.sh/chart: scrim-1.2.3
    app.kubernetes.io/part-of: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "1.2.3"
    app.kubernetes.io/name: scrim-test
    app.kubernetes.io/component: test
    scrim.dev/helm-test: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsGroup: 101
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: "docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93"
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          for i in $(seq 1 12); do
            if c="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://scrim.scrim.svc.cluster.local:9790/)" && [ "$c" != 000 ]; then
              echo "ok LLM listener"; exit 0
            fi
            sleep 5
          done
          echo "LLM listener: no answer"; exit 1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
      resources:
        limits:
          memory: 64Mi
        requests:
          cpu: 10m
          memory: 16Mi
