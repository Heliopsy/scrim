# Source: scrim/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrim-config
  namespace: scrim
  labels:
    helm.sh/chart: scrim-1.2.3
    app.kubernetes.io/part-of: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "1.2.3"
    app.kubernetes.io/name: scrim-proxy
    app.kubernetes.io/component: proxy
data:
  config.yaml: |
    apiVersion: scrim.dev/v1
    kind: Config
    ratelimit:
      agent-api:
        burst: 200
        rate: 1200
    stores:
      bao:
        address: https://bao.example.com:8200
        auth:
          method: approle
        kind: openbao
        redact:
        - bao://kv/agents/*
        role-id: file:/run/secrets/scrim/bao/role-id
        secret-id: file:/run/secrets/scrim/bao/secret-id
  chart.yaml: |
    # Settings the chart owns. This file comes last, so they win over config.yaml.
    apiVersion: scrim.dev/v1
    kind: Config
    profile: k8s
    log:
      level: info
      format: json
    api:
      socket: /run/scrim/api.sock
    entry:
      listen: 127.0.0.1:0
    tool-proxy:
      ca:
        cert-file: /etc/scrim/ca/tls.crt
        key: file:/etc/scrim/ca/tls.key
    proxy:
      listen: 0.0.0.0:9790
      forward-listen: 0.0.0.0:9791
    metrics:
      listen: 0.0.0.0:9792
      enabled: false
    identity:
      kubernetes:
        enabled: true
        audience: scrim
        unmapped: derive
    admin:
      url: unix:/run/scrim/admin.sock
    redaction:
      placeholder-keys:
        k1:
          version: 1
          key: file:/etc/scrim/placeholder/k1
    deployment:
      # Replicas sharing this state; more than one needs postgres for state (and postgres, valkey or nats for events).
      replicas: 3
    state:
      backend: postgres
      postgres:
        dsn: file:/run/secrets/scrim/postgres/dsn
        max-conns: 16
    events:
      backend: valkey
    valkey:
      addresses: ["valkey-0.valkey:6379","valkey-1.valkey:6379"]
      username: "scrim"
      password: file:/run/secrets/scrim/valkey/password
      db: 0
      tls: true
    ratelimit:
      backend: valkey
    audit:
      sinks:
        - db
        - otlp
        - loki
        - kafka
      otlp:
        endpoint: "http://otel-collector.observability:4318"
        policy: drop
        timeout: 5s
        queue-size: 10000
      loki:
        url: "http://loki-gateway.observability"
        tenant: "platform"
        username: "scrim"
        password: file:/run/secrets/scrim/loki/password
        labels:
          cluster: prod
        policy: block
        timeout: 2s
        queue-size: 10000
      kafka:
        brokers: ["kafka-0.kafka:9093","kafka-1.kafka:9093"]
        topic: "scrim-audit"
        tls: true
        sasl-mechanism: scram-sha-512
        username: "scrim"
        password: file:/run/secrets/scrim/kafka/password
        policy: drop
        timeout: 5s
        queue-size: 50000
