# Sidecars in agents. The bearer token Secret, if any, must exist in this namespace.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: scrim-sidecars
  namespace: agents
  labels:
    helm.sh/chart: scrim-0.1.0
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      scrim.dev/inject: sidecar
  podMetricsEndpoints:
    - port: scrim-health
