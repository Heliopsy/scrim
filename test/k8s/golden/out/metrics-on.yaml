# Source: scrim/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrim
  namespace: scrim
  labels:
    helm.sh/chart: scrim-0.1.0
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: scrim
      app.kubernetes.io/instance: scrim
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scrim
        app.kubernetes.io/instance: scrim
        app.kubernetes.io/component: proxy
      annotations:
        checksum/config: 5854a47880a1808f7805a54062325968b261b91f0014b4a0251e2d035d07119e
    spec:
      serviceAccountName: scrim
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scrim
          image: ghcr.io/heliopsy/scrim:0.1.0
          imagePullPolicy: IfNotPresent
          args: [proxy]
          env:
            - name: SCRIM_CONFIG
              value: /etc/scrim/config/config.yaml:/etc/scrim/config/chart.yaml
            - name: XDG_RUNTIME_DIR
              value: /run/scrim
          ports:
            - name: llm
              containerPort: 9790
              protocol: TCP
            - name: forward
              containerPort: 9791
              protocol: TCP
            - name: metrics
              containerPort: 9792
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 2
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /etc/scrim/config
              readOnly: true
            - name: ca
              mountPath: /etc/scrim/ca
              readOnly: true
            - name: placeholder-keys
              mountPath: /etc/scrim/placeholder
              readOnly: true
            - name: state
              mountPath: /var/lib/scrim
            - name: run
              mountPath: /run/scrim
            - name: tmp
              mountPath: /tmp
            - name: metrics-token
              mountPath: /run/secrets/scrim/metrics
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: scrim-config
        - name: ca
          secret:
            secretName: scrim-ca
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: placeholder-keys
          secret:
            secretName: scrim-placeholder-keys
            defaultMode: 0440
        - name: state
          emptyDir: {}
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: metrics-token
          secret:
            secretName: scrim-metrics
            defaultMode: 0440
            items:
              - key: token
                path: token
