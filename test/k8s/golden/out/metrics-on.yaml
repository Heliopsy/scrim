# Source: scrim/templates/ca.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrim-ca
  namespace: scrim
  labels:
    helm.sh/chart: scrim-0.1.0
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
