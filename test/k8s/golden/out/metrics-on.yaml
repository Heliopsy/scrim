apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scrim
  namespace: scrim
  labels:
    helm.sh/chart: scrim-1.2.3
    app.kubernetes.io/part-of: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "1.2.3"
    app.kubernetes.io/name: scrim-proxy
    app.kubernetes.io/component: proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: scrim-proxy
      app.kubernetes.io/instance: scrim
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - namespaceSelector:
          matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values:
            - agents
        podSelector:
          matchLabels:
            scrim.dev/inject: central
      ports:
      - port: 9790
        protocol: TCP
      - port: 9791
        protocol: TCP
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: observability
        podSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
      ports:
      - port: 9792
        protocol: TCP
    - from:
      - podSelector:
          matchLabels:
            scrim.dev/helm-test: "true"
      ports:
      - port: 9790
        protocol: TCP
      - port: 9791
        protocol: TCP
      - port: 9792
        protocol: TCP
  egress:
    - ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    - ports:
      - port: 443
        protocol: TCP
      - port: 6443
        protocol: TCP
    - ports:
      - port: 443
        protocol: TCP
