---
# Source: scrim/templates/networkpolicy.yaml
# Central scrim: agents reach the LLM and forward proxy ports; scrim reaches DNS and what
# networkPolicy.scrimEgress allows (providers, stores, tool hosts, PostgreSQL).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scrim
  namespace: scrim
  labels:
    helm.sh/chart: scrim-0.1.0
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: scrim
      app.kubernetes.io/instance: scrim
      app.kubernetes.io/component: proxy
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - agents
          podSelector:
            matchLabels:
              scrim.dev/inject: central
      ports:
        - port: 9790
          protocol: TCP
        - port: 9791
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9792
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
      - port: 443
        protocol: TCP
---
