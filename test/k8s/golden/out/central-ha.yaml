# Source: scrim/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrim-config
  namespace: scrim
  labels:
    helm.sh/chart: scrim-0.2.0
    app.kubernetes.io/part-of: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/name: scrim-proxy
    app.kubernetes.io/component: proxy
data:
  config.yaml: |
    apiVersion: scrim.dev/v1
    kind: Config
    stores:
      bao:
        address: https://bao.example.com:8200
        auth:
          method: approle
        kind: openbao
        redact:
        - bao://kv/agents/*
        role-id: file:/run/secrets/scrim/bao/role-id
        secret-id: file:/run/secrets/scrim/bao/secret-id
  chart.yaml: |
    # Settings the chart owns. This file comes last, so they win over config.yaml.
    apiVersion: scrim.dev/v1
    kind: Config
    profile: k8s
    log:
      level: info
      format: json
    api:
      socket: /run/scrim/api.sock
    entry:
      listen: 127.0.0.1:0
    tool-proxy:
      ca:
        cert-file: /etc/scrim/ca/tls.crt
        key: file:/etc/scrim/ca/tls.key
    proxy:
      listen: 0.0.0.0:9790
      forward-listen: 0.0.0.0:9791
    metrics:
      listen: 0.0.0.0:9792
      enabled: true
      path: /metrics
      auth:
        token: file:/run/secrets/scrim/metrics/token
    identity:
      kubernetes:
        enabled: true
        audience: scrim
        unmapped: derive
    admin:
      url: http://0.0.0.0:9793
      token: file:/run/secrets/scrim/admin/token
    redaction:
      placeholder-keys:
        k1:
          version: 1
          key: file:/etc/scrim/placeholder/k1
    deployment:
      # Replicas sharing this state; more than one needs postgres for state and events.
      replicas: 12
    state:
      backend: postgres
      postgres:
        dsn: file:/run/secrets/scrim/postgres/dsn
        max-conns: 16
    events:
      backend: postgres
