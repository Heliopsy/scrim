# Source: scrim/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrim
  namespace: scrim
  labels:
    helm.sh/chart: scrim-0.1.0
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: proxy
spec:
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: scrim
      app.kubernetes.io/instance: scrim
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scrim
        app.kubernetes.io/instance: scrim
        app.kubernetes.io/component: proxy
      annotations:
        checksum/config: e136b2ea4e233fedd032c6cf3b72ae9527f18e3de5903ca99b21c0ab643c9fa4
    spec:
      serviceAccountName: scrim
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scrim
          image: ghcr.io/heliopsy/scrim:0.1.0
          imagePullPolicy: IfNotPresent
          args: [proxy]
          env:
            - name: SCRIM_CONFIG
              value: /etc/scrim/config/config.yaml:/etc/scrim/config/chart.yaml
            - name: XDG_RUNTIME_DIR
              value: /run/scrim
          ports:
            - name: llm
              containerPort: 9790
              protocol: TCP
            - name: forward
              containerPort: 9791
              protocol: TCP
            - name: health
              containerPort: 9792
              protocol: TCP
            - name: admin
              containerPort: 9793
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /livez
              port: health
            periodSeconds: 2
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /etc/scrim/config
              readOnly: true
            - name: ca
              mountPath: /etc/scrim/ca
              readOnly: true
            - name: placeholder-keys
              mountPath: /etc/scrim/placeholder
              readOnly: true
            - name: state
              mountPath: /var/lib/scrim
            - name: run
              mountPath: /run/scrim
            - name: tmp
              mountPath: /tmp
            - name: postgres
              mountPath: /run/secrets/scrim/postgres
              readOnly: true
            - name: admin-token
              mountPath: /run/secrets/scrim/admin
              readOnly: true
            - name: secret-bao
              mountPath: /run/secrets/scrim/bao
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: scrim-config
        - name: ca
          secret:
            secretName: scrim-ca
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: placeholder-keys
          secret:
            secretName: scrim-placeholder-keys
            defaultMode: 0440
        - name: state
          emptyDir: {}
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: postgres
          secret:
            secretName: scrim-pg
            defaultMode: 0440
            items:
              - key: dsn
                path: dsn
        - name: admin-token
          secret:
            secretName: scrim-admin
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: secret-bao
          secret:
            secretName: scrim-bao-approle
            defaultMode: 0440
---
# Source: scrim/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scrim
  namespace: scrim
  labels:
    helm.sh/chart: scrim-0.1.0
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scrim
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Concurrent proxied streams per replica, served by a metrics adapter.
    - type: Pods
      pods:
        metric:
          name: scrim_proxy_active_streams
        target:
          type: AverageValue
          averageValue: "40"
