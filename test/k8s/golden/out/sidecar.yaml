# Source: scrim/templates/rbac.yaml
# TokenReview only, to verify the projected tokens agent pods present. Narrower than
# system:auth-delegator, which also allows SubjectAccessReviews.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scrim-scrim-tokenreview
  labels:
    helm.sh/chart: scrim-0.2.0
    app.kubernetes.io/part-of: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.2.0"
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
# Source: scrim/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scrim-scrim-tokenreview
  labels:
    helm.sh/chart: scrim-0.2.0
    app.kubernetes.io/part-of: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.2.0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scrim-scrim-tokenreview
subjects:
  # The in-pod scrim runs as the agent pod's service account.
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:agents
---
# Source: scrim/templates/kyverno.yaml
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: scrim-scrim-inject-sidecar
  labels:
    helm.sh/chart: scrim-0.2.0
    app.kubernetes.io/part-of: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.2.0"
  annotations:
    policies.kyverno.io/title: scrim agent injection, sidecar
    policies.kyverno.io/description: >-
      Pods labelled scrim.dev/inject=sidecar get an in-pod scrim as a native sidecar, the egress
      guard, and the environment, CA, identity token and scrim-exec launcher pointing at it.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    objectSelector:
      matchLabels:
        scrim.dev/inject: sidecar
  variables:
    - name: env
      expression: |
        json.unmarshal(r'''
        [
          {
            "name": "ANTHROPIC_BASE_URL",
            "value": "http://127.0.0.1:9790/anthropic"
          },
          {
            "name": "OPENAI_BASE_URL",
            "value": "http://127.0.0.1:9790/openai/v1"
          },
          {
            "name": "HTTPS_PROXY",
            "value": "http://127.0.0.1:9791"
          },
          {
            "name": "https_proxy",
            "value": "http://127.0.0.1:9791"
          },
          {
            "name": "HTTP_PROXY",
            "value": "http://127.0.0.1:9791"
          },
          {
            "name": "http_proxy",
            "value": "http://127.0.0.1:9791"
          },
          {
            "name": "NO_PROXY",
            "value": "localhost,127.0.0.1,::1"
          },
          {
            "name": "no_proxy",
            "value": "localhost,127.0.0.1,::1"
          },
          {
            "name": "NODE_EXTRA_CA_CERTS",
            "value": "/etc/scrim/trust/scrim-ca.pem"
          },
          {
            "name": "SSL_CERT_FILE",
            "value": "/etc/scrim/trust/ca-bundle.pem"
          },
          {
            "name": "REQUESTS_CA_BUNDLE",
            "value": "/etc/scrim/trust/ca-bundle.pem"
          },
          {
            "name": "CURL_CA_BUNDLE",
            "value": "/etc/scrim/trust/ca-bundle.pem"
          },
          {
            "name": "GIT_SSL_CAINFO",
            "value": "/etc/scrim/trust/ca-bundle.pem"
          },
          {
            "name": "AWS_CA_BUNDLE",
            "value": "/etc/scrim/trust/ca-bundle.pem"
          },
          {
            "name": "PIP_CERT",
            "value": "/etc/scrim/trust/ca-bundle.pem"
          },
          {
            "name": "NPM_CONFIG_CAFILE",
            "value": "/etc/scrim/trust/ca-bundle.pem"
          },
          {
            "name": "CARGO_HTTP_CAINFO",
            "value": "/etc/scrim/trust/ca-bundle.pem"
          },
          {
            "name": "DENO_CERT",
            "value": "/etc/scrim/trust/ca-bundle.pem"
          },
          {
            "name": "CODEX_CA_CERTIFICATE",
            "value": "/etc/scrim/trust/ca-bundle.pem"
          },
          {
            "name": "SCRIM_K8S_TOKEN_FILE",
            "value": "/var/run/secrets/scrim/token"
          }
        ]
        ''')
    - name: envNames
      expression: variables.env.map(e, e.name)
    - name: mounts
      expression: |
        json.unmarshal(r'''
        [
          {
            "mountPath": "/etc/scrim/trust",
            "name": "scrim-trust",
            "readOnly": true
          },
          {
            "mountPath": "/var/run/secrets/scrim",
            "name": "scrim-identity",
            "readOnly": true
          }
        ]
        ''')
    - name: mountPaths
      expression: variables.mounts.map(m, m.mountPath)
    - name: volumes
      expression: |
        json.unmarshal(r'''
        [
          {
            "configMap": {
              "items": [
                {
                  "key": "scrim-ca.pem",
                  "path": "scrim-ca.pem"
                },
                {
                  "key": "ca-bundle.pem",
                  "path": "ca-bundle.pem"
                },
                {
                  "key": "scrim-exec",
                  "mode": 365,
                  "path": "scrim-exec"
                }
              ],
              "name": "scrim-ca"
            },
            "name": "scrim-trust"
          },
          {
            "name": "scrim-identity",
            "projected": {
              "defaultMode": 292,
              "sources": [
                {
                  "serviceAccountToken": {
                    "audience": "scrim",
                    "expirationSeconds": 3600,
                    "path": "token"
                  }
                }
              ]
            }
          },
          {
            "configMap": {
              "name": "scrim-sidecar-config"
            },
            "name": "scrim-sidecar-config"
          },
          {
            "name": "scrim-sidecar-ca",
            "secret": {
              "defaultMode": 292,
              "items": [
                {
                  "key": "tls.crt",
                  "path": "tls.crt"
                },
                {
                  "key": "tls.key",
                  "path": "tls.key"
                }
              ],
              "secretName": "scrim-sidecar-ca"
            }
          },
          {
            "name": "scrim-sidecar-keys",
            "secret": {
              "defaultMode": 292,
              "secretName": "scrim-sidecar-keys"
            }
          },
          {
            "name": "scrim-kube-api",
            "projected": {
              "defaultMode": 292,
              "sources": [
                {
                  "serviceAccountToken": {
                    "expirationSeconds": 3600,
                    "path": "token"
                  }
                },
                {
                  "configMap": {
                    "items": [
                      {
                        "key": "ca.crt",
                        "path": "ca.crt"
                      }
                    ],
                    "name": "kube-root-ca.crt"
                  }
                }
              ]
            }
          },
          {
            "emptyDir": {},
            "name": "scrim-state"
          },
          {
            "emptyDir": {
              "medium": "Memory",
              "sizeLimit": "64Mi"
            },
            "name": "scrim-run"
          },
          {
            "emptyDir": {
              "sizeLimit": "64Mi"
            },
            "name": "scrim-tmp"
          },
          {
            "name": "scrim-secret-bao",
            "secret": {
              "defaultMode": 292,
              "secretName": "bao-token"
            }
          }
        ]
        ''')
    - name: volumeNames
      expression: variables.volumes.map(v, v.name)
    # The scrim container is a native sidecar (restartPolicy Always): it starts, and passes its
    # startup probe, before the agent.
    - name: initContainers
      expression: |
        json.unmarshal(r'''
        [
          {
            "args": [
              "set -eu\nnft -f - \u003c\u003c'NFT'\ntable inet scrim_guard {\n  chain output {\n    type filter hook output priority 0; policy accept;\n    oifname \"lo\" accept\n    ct state established,related accept\n    meta skuid 65532 accept\n    udp dport 53 accept\n    tcp dport 53 accept\n    meta l4proto tcp reject with tcp reset\n    reject with icmpx admin-prohibited\n  }\n}\nNFT\nnft list table inet scrim_guard\n"
            ],
            "command": [
              "sh",
              "-c"
            ],
            "image": "registry.example.com/nft:1",
            "imagePullPolicy": "IfNotPresent",
            "name": "scrim-egress-guard",
            "resources": {
              "limits": {
                "memory": "32Mi"
              },
              "requests": {
                "cpu": "10m",
                "memory": "16Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "add": [
                  "NET_ADMIN"
                ],
                "drop": [
                  "ALL"
                ]
              },
              "readOnlyRootFilesystem": true,
              "runAsNonRoot": false,
              "runAsUser": 0,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            }
          },
          {
            "args": [
              "proxy"
            ],
            "env": [
              {
                "name": "SCRIM_CONFIG",
                "value": "/etc/scrim/config/config.yaml:/etc/scrim/config/chart.yaml"
              },
              {
                "name": "XDG_RUNTIME_DIR",
                "value": "/run/scrim"
              }
            ],
            "image": "ghcr.io/heliopsy/scrim:0.2.0",
            "imagePullPolicy": "IfNotPresent",
            "livenessProbe": {
              "httpGet": {
                "path": "/livez",
                "port": 9792
              },
              "periodSeconds": 10
            },
            "name": "scrim",
            "ports": [
              {
                "containerPort": 9792,
                "name": "scrim-health",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/readyz",
                "port": 9792
              },
              "periodSeconds": 5
            },
            "resources": {
              "limits": {
                "memory": "384Mi"
              },
              "requests": {
                "cpu": "50m",
                "memory": "96Mi"
              }
            },
            "restartPolicy": "Always",
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "readOnlyRootFilesystem": true,
              "runAsGroup": 65532,
              "runAsNonRoot": true,
              "runAsUser": 65532,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "startupProbe": {
              "failureThreshold": 120,
              "httpGet": {
                "path": "/readyz",
                "port": 9792
              },
              "periodSeconds": 1
            },
            "volumeMounts": [
              {
                "mountPath": "/etc/scrim/config",
                "name": "scrim-sidecar-config",
                "readOnly": true
              },
              {
                "mountPath": "/etc/scrim/ca",
                "name": "scrim-sidecar-ca",
                "readOnly": true
              },
              {
                "mountPath": "/etc/scrim/placeholder",
                "name": "scrim-sidecar-keys",
                "readOnly": true
              },
              {
                "mountPath": "/var/lib/scrim",
                "name": "scrim-state"
              },
              {
                "mountPath": "/run/scrim",
                "name": "scrim-run"
              },
              {
                "mountPath": "/tmp",
                "name": "scrim-tmp"
              },
              {
                "mountPath": "/var/run/secrets/scrim/kube-api",
                "name": "scrim-kube-api",
                "readOnly": true
              },
              {
                "mountPath": "/run/secrets/scrim/bao",
                "name": "scrim-secret-bao",
                "readOnly": true
              }
            ]
          }
        ]
        ''')
    - name: initContainerNames
      expression: variables.initContainers.map(c, c.name)
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          object.spec.containers.map(c, JSONPatch{
            op: "add",
            path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/env",
            value: c.?env.orValue([]).filter(e, !(e.name in variables.envNames)) + variables.env
          }) +
          object.spec.containers.map(c, JSONPatch{
            op: "add",
            path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/volumeMounts",
            value: c.?volumeMounts.orValue([]).filter(m, !(m.mountPath in variables.mountPaths)) + variables.mounts
          }) +
          [JSONPatch{
            op: "add",
            path: "/spec/initContainers",
            value: variables.initContainers +
              object.spec.?initContainers.orValue([]).filter(c, !(c.name in variables.initContainerNames))
          }] +
          [JSONPatch{
            op: "add",
            path: "/spec/volumes",
            value: object.spec.?volumes.orValue([]).filter(v, !(v.name in variables.volumeNames)) + variables.volumes
          }]
