apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: scrim-scrim-require-prepared-namespace
  labels:
    helm.sh/chart: scrim-0.2.0
    app.kubernetes.io/part-of: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.2.0"
  annotations:
    policies.kyverno.io/title: scrim agent namespaces
    policies.kyverno.io/description: >-
      Pods labelled scrim.dev/inject are refused outside the namespaces the scrim chart prepared
      (agents.namespaces), or with a label value other than sidecar.
spec:
  failurePolicy: Fail
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    objectSelector:
      matchExpressions:
        - key: scrim.dev/inject
          operator: Exists
  variables:
    - name: namespaces
      expression: "[\"agents\"]"
    - name: modes
      expression: "[\"sidecar\"]"
  validations:
    - expression: >-
        request.namespace in variables.namespaces &&
        object.metadata.?labels["scrim.dev/inject"].orValue("") in variables.modes
      message: >-
        Pods labelled scrim.dev/inject must run in a namespace listed in the scrim chart's
        agents.namespaces (where its CA, environment and NetworkPolicies exist), with a label
        value of sidecar.
