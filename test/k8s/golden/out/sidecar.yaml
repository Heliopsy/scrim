---
# Source: scrim/templates/networkpolicy.yaml
# Agent pods labelled scrim.dev/inject=sidecar: the pod reaches DNS and what the in-pod scrim
# needs. The egress guard keeps the agent's own processes on loopback.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scrim-agents-sidecar
  namespace: agents
  labels:
    helm.sh/chart: scrim-0.1.0
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      scrim.dev/inject: sidecar
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
      - port: 443
        protocol: TCP
---
