# Source: scrim/templates/agents.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrim-sidecar-config
  namespace: agents
  labels:
    helm.sh/chart: scrim-0.2.0
    app.kubernetes.io/part-of: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.2.0"
data:
  config.yaml: |
    apiVersion: scrim.dev/v1
    kind: Config
  chart.yaml: |
    # Settings the chart owns for the in-pod scrim. Listeners stay on loopback; the health
    # and metrics port is on the pod IP for probes and scrapes.
    apiVersion: scrim.dev/v1
    kind: Config
    profile: k8s
    log:
      level: info
      format: json
    api:
      socket: /run/scrim/api.sock
    entry:
      listen: 127.0.0.1:0
    tool-proxy:
      ca:
        cert-file: /etc/scrim/ca/tls.crt
        key: file:/etc/scrim/ca/tls.key
    policy:
      rules-file: /etc/scrim/config/policy.yaml
    proxy:
      listen: 127.0.0.1:9790
      forward-listen: 127.0.0.1:9791
    metrics:
      listen: 0.0.0.0:9792
      enabled: false
    identity:
      kubernetes:
        enabled: true
        audience: scrim
        unmapped: derive
        token-file: /var/run/secrets/scrim/kube-api/token
        ca-file: /var/run/secrets/scrim/kube-api/ca.crt
    admin:
      url: unix:/run/scrim/admin.sock
    redaction:
      placeholder-keys:
        k1:
          version: 1
          key: file:/etc/scrim/placeholder/k1
    # One scrim per pod, so nothing is shared between replicas.
    deployment:
      replicas: 1
    state:
      backend: memory
    events:
      backend: local
  policy.yaml: |
    rules:
    - decision: allow
      name: inject-github
      when: op == "inject" && dest.host == "api.github.com"
---
# Source: scrim/templates/ca.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrim-ca
  namespace: scrim
  labels:
    helm.sh/chart: scrim-0.2.0
    app.kubernetes.io/part-of: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.2.0"
data:
  # scrim's interception CA, for runtimes that add to their roots (NODE_EXTRA_CA_CERTS).
  scrim-ca.pem: |
    -----BEGIN CERTIFICATE-----
    -----END CERTIFICATE-----
  # For runtimes that replace their roots (SSL_CERT_FILE and friends). Agent pods reach only
  # scrim, so every TLS connection they make ends at a scrim leaf; extra cluster CAs go in
  # ca.extraTrustedCerts.
  ca-bundle.pem: |
    -----BEGIN CERTIFICATE-----
    -----END CERTIFICATE-----
  # Runs an agent command with the pod's projected token as its scrim identity.
  scrim-exec: |
    #!/bin/sh
    # scrim-exec COMMAND [ARGS...]: run COMMAND identified to scrim by this pod's service account
    # (docs/kubernetes.md, "Identity"). Generated by the scrim Helm chart.
    set -eu
    f="${SCRIM_K8S_TOKEN_FILE:?scrim-exec: SCRIM_K8S_TOKEN_FILE is not set}"
    [ "$#" -gt 0 ] || { echo "scrim-exec: no command" >&2; exit 2; }
    tok=
    IFS= read -r tok < "$f" || true
    [ -n "$tok" ] || { echo "scrim-exec: $f is empty" >&2; exit 1; }
    for v in HTTPS_PROXY https_proxy HTTP_PROXY http_proxy; do
      eval "u=\${$v:-}"
      case $u in
        http://*@*) ;;
        http://*) export "$v=http://k8s:$tok@${u#http://}" ;;
      esac
    done
    # git sends proxy credentials only after a 407, which scrim never sends.
    export GIT_HTTP_PROXY_AUTHMETHOD=basic
    nl='
    '
    hdrs=
    old_ifs=$IFS
    IFS=$nl
    set -f
    for line in ${ANTHROPIC_CUSTOM_HEADERS:-}; do
      case $line in
        [Xx]-[Ss][Cc][Rr][Ii][Mm]-[Ss][Ee][Ss][Ss][Ii][Oo][Nn]:*) ;;
        *) hdrs="$hdrs$line$nl" ;;
      esac
    done
    set +f
    IFS=$old_ifs
    export ANTHROPIC_CUSTOM_HEADERS="${hdrs}x-scrim-session: $tok"
    unset f tok u v hdrs line nl old_ifs
    exec "$@"
---
