# Source: scrim/templates/serviceaccount.yaml
# TokenReview only, to verify the projected tokens agent pods present. Narrower than
# system:auth-delegator, which also allows SubjectAccessReviews.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scrim-scrim-tokenreview
  labels:
    helm.sh/chart: scrim-0.1.0
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
# Source: scrim/templates/serviceaccount.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scrim-scrim-tokenreview
  labels:
    helm.sh/chart: scrim-0.1.0
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scrim-scrim-tokenreview
subjects:
  # The in-pod scrim runs as the agent pod's service account.
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:agents
---
# Source: scrim/templates/kyverno.yaml
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: scrim-scrim-inject
  labels:
    helm.sh/chart: scrim-0.1.0
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    policies.kyverno.io/title: scrim agent injection
    policies.kyverno.io/description: >-
      Pods labelled scrim.dev/inject=central get the base URLs, forward proxy and CA of the central
      scrim; pods labelled scrim.dev/inject=sidecar get an in-pod scrim. Labelled pods outside the
      prepared namespaces are refused.
    # Mutate Pods only, never their controllers: a Deployment in Git stays as written.
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: false
  failurePolicy: Fail
  rules:
    - name: require-prepared-namespace
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE]
              selector:
                matchExpressions:
                  - key: scrim.dev/inject
                    operator: Exists
      validate:
        failureAction: Enforce
        message: >-
          Pods labelled scrim.dev/inject must run in a namespace listed in the scrim chart's
          agents.namespaces (where its CA, environment and NetworkPolicies exist), with a label
          value of sidecar.
        deny:
          conditions:
            any:
              - key: "{{ request.namespace }}"
                operator: AnyNotIn
                value:
                  - agents
              - key: "{{ request.object.metadata.labels.\"scrim.dev/inject\" }}"
                operator: AnyNotIn
                value:
                  - sidecar
    - name: inject-sidecar
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE]
              selector:
                matchLabels:
                  scrim.dev/inject: sidecar
      mutate:
        patchStrategicMerge:
          spec:
            initContainers:
              - name: scrim-egress-guard
                image: registry.example.com/nft:1
                imagePullPolicy: IfNotPresent
                command: [sh, -c]
                args:
                  - |
                    set -eu
                    nft -f - <<'NFT'
                    table inet scrim_guard {
                      chain output {
                        type filter hook output priority 0; policy accept;
                        oifname "lo" accept
                        ct state established,related accept
                        meta skuid 65532 accept
                        udp dport 53 accept
                        tcp dport 53 accept
                        meta l4proto tcp reject with tcp reset
                        reject with icmpx admin-prohibited
                      }
                    }
                    NFT
                    nft list table inet scrim_guard
                securityContext:
                  runAsUser: 0
                  runAsNonRoot: false
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
                    add: [NET_ADMIN]
                resources:
                  requests:
                    cpu: 10m
                    memory: 16Mi
                  limits:
                    memory: 32Mi
              - name: scrim
                image: ghcr.io/heliopsy/scrim:0.1.0
                imagePullPolicy: IfNotPresent
                # A native sidecar: it starts, and passes its startup probe, before the agent.
                restartPolicy: Always
                args: [proxy]
                env:
                  - name: SCRIM_CONFIG
                    value: /etc/scrim/config/config.yaml:/etc/scrim/config/chart.yaml
                  - name: XDG_RUNTIME_DIR
                    value: /run/scrim
                ports:
                  - name: scrim-health
                    containerPort: 9792
                    protocol: TCP
                startupProbe:
                  httpGet:
                    path: /readyz
                    port: 9792
                  periodSeconds: 1
                  failureThreshold: 120
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 9792
                  periodSeconds: 5
                livenessProbe:
                  httpGet:
                    path: /livez
                    port: 9792
                  periodSeconds: 10
                resources:
                  limits:
                    memory: 384Mi
                  requests:
                    cpu: 50m
                    memory: 96Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
                  runAsGroup: 65532
                  runAsNonRoot: true
                  runAsUser: 65532
                  seccompProfile:
                    type: RuntimeDefault
                volumeMounts:
                  - name: scrim-sidecar-config
                    mountPath: /etc/scrim/config
                    readOnly: true
                  - name: scrim-sidecar-ca
                    mountPath: /etc/scrim/ca
                    readOnly: true
                  - name: scrim-sidecar-keys
                    mountPath: /etc/scrim/placeholder
                    readOnly: true
                  - name: scrim-state
                    mountPath: /var/lib/scrim
                  - name: scrim-run
                    mountPath: /run/scrim
                  - name: scrim-tmp
                    mountPath: /tmp
                  # The pod's own API token, for TokenReview; only this container sees it.
                  - name: scrim-kube-api
                    mountPath: /var/run/secrets/scrim/kube-api
                    readOnly: true
                  - name: scrim-secret-bao
                    mountPath: /run/secrets/scrim/bao
                    readOnly: true
            containers:
              - (name): "*"
                env:
                  - name: ANTHROPIC_BASE_URL
                    value: "http://127.0.0.1:9790/anthropic"
                  - name: OPENAI_BASE_URL
                    value: "http://127.0.0.1:9790/openai/v1"
                  - name: HTTPS_PROXY
                    value: "http://127.0.0.1:9791"
                  - name: https_proxy
                    value: "http://127.0.0.1:9791"
                  - name: HTTP_PROXY
                    value: "http://127.0.0.1:9791"
                  - name: http_proxy
                    value: "http://127.0.0.1:9791"
                  - name: NO_PROXY
                    value: "localhost,127.0.0.1,::1"
                  - name: no_proxy
                    value: "localhost,127.0.0.1,::1"
                  - name: NODE_EXTRA_CA_CERTS
                    value: "/etc/scrim/trust/scrim-ca.pem"
                  - name: SSL_CERT_FILE
                    value: "/etc/scrim/trust/ca-bundle.pem"
                  - name: REQUESTS_CA_BUNDLE
                    value: "/etc/scrim/trust/ca-bundle.pem"
                  - name: CURL_CA_BUNDLE
                    value: "/etc/scrim/trust/ca-bundle.pem"
                  - name: GIT_SSL_CAINFO
                    value: "/etc/scrim/trust/ca-bundle.pem"
                  - name: AWS_CA_BUNDLE
                    value: "/etc/scrim/trust/ca-bundle.pem"
                  - name: PIP_CERT
                    value: "/etc/scrim/trust/ca-bundle.pem"
                  - name: NPM_CONFIG_CAFILE
                    value: "/etc/scrim/trust/ca-bundle.pem"
                  - name: CARGO_HTTP_CAINFO
                    value: "/etc/scrim/trust/ca-bundle.pem"
                  - name: DENO_CERT
                    value: "/etc/scrim/trust/ca-bundle.pem"
                  - name: CODEX_CA_CERTIFICATE
                    value: "/etc/scrim/trust/ca-bundle.pem"
                  - name: SCRIM_K8S_TOKEN_FILE
                    value: "/var/run/secrets/scrim/token"
                volumeMounts:
                  - name: scrim-trust
                    mountPath: /etc/scrim/trust
                    readOnly: true
                  - name: scrim-identity
                    mountPath: /var/run/secrets/scrim
                    readOnly: true
            volumes:
              - name: scrim-trust
                configMap:
                  name: scrim-ca
                  items:
                    - key: scrim-ca.pem
                      path: scrim-ca.pem
                    - key: ca-bundle.pem
                      path: ca-bundle.pem
                    - key: scrim-exec
                      path: scrim-exec
                      mode: 0555
              - name: scrim-identity
                projected:
                  # Readable by whatever user the agent runs as; only agent containers mount it.
                  defaultMode: 0444
                  sources:
                    - serviceAccountToken:
                        audience: scrim
                        expirationSeconds: 3600
                        path: token
              # Mounted only into the scrim container. The agent pod has no fsGroup to rely
              # on, so the files are world-readable inside that one mount.
              - name: scrim-sidecar-config
                configMap:
                  name: scrim-sidecar-config
              - name: scrim-sidecar-ca
                secret:
                  secretName: scrim-sidecar-ca
                  defaultMode: 0444
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
              - name: scrim-sidecar-keys
                secret:
                  secretName: scrim-sidecar-keys
                  defaultMode: 0444
              - name: scrim-kube-api
                projected:
                  defaultMode: 0444
                  sources:
                    - serviceAccountToken:
                        expirationSeconds: 3600
                        path: token
                    - configMap:
                        name: kube-root-ca.crt
                        items:
                          - key: ca.crt
                            path: ca.crt
              - name: scrim-state
                emptyDir: {}
              - name: scrim-run
                emptyDir:
                  medium: Memory
                  sizeLimit: 64Mi
              - name: scrim-tmp
                emptyDir:
                  sizeLimit: 64Mi
              - name: scrim-secret-bao
                secret:
                  secretName: bao-token
                  defaultMode: 0444
