# Source: scrim/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrim-config
  namespace: scrim
  labels:
    helm.sh/chart: scrim-1.2.3
    app.kubernetes.io/part-of: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "1.2.3"
    app.kubernetes.io/name: scrim-proxy
    app.kubernetes.io/component: proxy
data:
  config.yaml: |
    apiVersion: scrim.dev/v1
    kind: Config
  chart.yaml: |
    # Settings the chart owns. This file comes last, so they win over config.yaml.
    apiVersion: scrim.dev/v1
    kind: Config
    profile: k8s
    log:
      level: info
      format: json
    api:
      socket: /run/scrim/api.sock
    entry:
      listen: 127.0.0.1:0
    tool-proxy:
      ca:
        cert-file: /etc/scrim/ca/tls.crt
        key: file:/etc/scrim/ca/tls.key
    proxy:
      listen: 0.0.0.0:9790
      forward-listen: 0.0.0.0:9791
    metrics:
      listen: 0.0.0.0:9792
      enabled: true
      path: /metrics
      allow-unauthenticated-remote: true
    identity:
      kubernetes:
        enabled: true
        audience: scrim
        unmapped: derive
    admin:
      url: unix:/run/scrim/admin.sock
    redaction:
      placeholder-keys:
        k1:
          version: 1
          key: file:/etc/scrim/placeholder/k1
    deployment:
      # Replicas sharing this state; more than one needs postgres for state and events.
      replicas: 1
    state:
      backend: memory
    events:
      backend: local
