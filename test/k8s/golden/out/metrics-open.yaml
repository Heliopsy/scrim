# Source: scrim/templates/ca.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrim-ca
  namespace: scrim
  labels:
    helm.sh/chart: scrim-0.1.0
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
data:
  # scrim's interception CA, for runtimes that add to their roots (NODE_EXTRA_CA_CERTS).
  scrim-ca.pem: |
    -----BEGIN CERTIFICATE-----
    -----END CERTIFICATE-----
  # For runtimes that replace their roots (SSL_CERT_FILE and friends). Agent pods reach only
  # scrim, so every TLS connection they make ends at a scrim leaf; extra cluster CAs go in
  # ca.extraTrustedCerts.
  ca-bundle.pem: |
    -----BEGIN CERTIFICATE-----
    -----END CERTIFICATE-----
  # Runs an agent command with the pod's projected token as its scrim identity.
  scrim-exec: |
    #!/bin/sh
    # scrim-exec COMMAND [ARGS...]: run COMMAND identified to scrim by this pod's service account
    # (docs/kubernetes.md, "Identity"). Generated by the scrim Helm chart.
    set -eu
    f="${SCRIM_K8S_TOKEN_FILE:?scrim-exec: SCRIM_K8S_TOKEN_FILE is not set}"
    [ "$#" -gt 0 ] || { echo "scrim-exec: no command" >&2; exit 2; }
    tok=
    IFS= read -r tok < "$f" || true
    [ -n "$tok" ] || { echo "scrim-exec: $f is empty" >&2; exit 1; }
    for v in HTTPS_PROXY https_proxy HTTP_PROXY http_proxy; do
      eval "u=\${$v:-}"
      case $u in
        http://*@*) ;;
        http://*) export "$v=http://k8s:$tok@${u#http://}" ;;
      esac
    done
    # git sends proxy credentials only after a 407, which scrim never sends.
    export GIT_HTTP_PROXY_AUTHMETHOD=basic
    nl='
    '
    hdrs=
    old_ifs=$IFS
    IFS=$nl
    set -f
    for line in ${ANTHROPIC_CUSTOM_HEADERS:-}; do
      case $line in
        [Xx]-[Ss][Cc][Rr][Ii][Mm]-[Ss][Ee][Ss][Ss][Ii][Oo][Nn]:*) ;;
        *) hdrs="$hdrs$line$nl" ;;
      esac
    done
    set +f
    IFS=$old_ifs
    export ANTHROPIC_CUSTOM_HEADERS="${hdrs}x-scrim-session: $tok"
    unset f tok u v hdrs line nl old_ifs
    exec "$@"
---
# Source: scrim/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrim-config
  namespace: scrim
  labels:
    helm.sh/chart: scrim-0.1.0
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
data:
  config.yaml: |
    apiVersion: scrim.dev/v1
    kind: Config
  chart.yaml: |
    # Settings the chart owns. This file comes last, so they win over config.yaml.
    apiVersion: scrim.dev/v1
    kind: Config
    profile: k8s
    log:
      level: info
      format: json
    api:
      socket: /run/scrim/api.sock
    entry:
      listen: 127.0.0.1:0
    tool-proxy:
      ca:
        cert-file: /etc/scrim/ca/tls.crt
        key: file:/etc/scrim/ca/tls.key
    proxy:
      listen: 0.0.0.0:9790
      forward-listen: 0.0.0.0:9791
    metrics:
      listen: 0.0.0.0:9792
      enabled: true
      path: /metrics
      allow-unauthenticated-remote: true
    identity:
      kubernetes:
        enabled: true
        audience: scrim
        unmapped: derive
    admin:
      url: unix:/run/scrim/admin.sock
    redaction:
      placeholder-keys:
        k1:
          version: 1
          key: file:/etc/scrim/placeholder/k1
    deployment:
      # Replicas sharing this state; more than one needs postgres for state and events.
      replicas: 1
    state:
      backend: memory
    events:
      backend: local
---
# Source: scrim/templates/serviceaccount.yaml
# TokenReview only, to verify the projected tokens agent pods present. Narrower than
# system:auth-delegator, which also allows SubjectAccessReviews.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scrim-scrim-tokenreview
  labels:
    helm.sh/chart: scrim-0.1.0
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
# Source: scrim/templates/serviceaccount.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scrim-scrim-tokenreview
  labels:
    helm.sh/chart: scrim-0.1.0
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scrim-scrim-tokenreview
subjects:
  - kind: ServiceAccount
    name: scrim
    namespace: scrim
---
# Source: scrim/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: scrim
  namespace: scrim
  labels:
    helm.sh/chart: scrim-0.1.0
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/component: proxy
  ports:
    - name: llm
      port: 9790
      targetPort: llm
      protocol: TCP
      appProtocol: http
    - name: forward
      port: 9791
      targetPort: forward
      protocol: TCP
    - name: metrics
      port: 9792
      targetPort: metrics
      protocol: TCP
      appProtocol: http
---
# Source: scrim/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrim
  namespace: scrim
  labels:
    helm.sh/chart: scrim-0.1.0
    app.kubernetes.io/name: scrim
    app.kubernetes.io/instance: scrim
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: scrim
      app.kubernetes.io/instance: scrim
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scrim
        app.kubernetes.io/instance: scrim
        app.kubernetes.io/component: proxy
      annotations:
        checksum/config: 9850aa02a0bfa8143f67703ab3d126b56e5d17b4c7fb37e82b46850fa834449c
    spec:
      serviceAccountName: scrim
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scrim
          image: ghcr.io/heliopsy/scrim:0.1.0
          imagePullPolicy: IfNotPresent
          args: [proxy]
          env:
            - name: SCRIM_CONFIG
              value: /etc/scrim/config/config.yaml:/etc/scrim/config/chart.yaml
            - name: XDG_RUNTIME_DIR
              value: /run/scrim
          ports:
            - name: llm
              containerPort: 9790
              protocol: TCP
            - name: forward
              containerPort: 9791
              protocol: TCP
            - name: metrics
              containerPort: 9792
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 2
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /etc/scrim/config
              readOnly: true
            - name: ca
              mountPath: /etc/scrim/ca
              readOnly: true
            - name: placeholder-keys
              mountPath: /etc/scrim/placeholder
              readOnly: true
            - name: state
              mountPath: /var/lib/scrim
            - name: run
              mountPath: /run/scrim
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: scrim-config
        - name: ca
          secret:
            secretName: scrim-ca
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: placeholder-keys
          secret:
            secretName: scrim-placeholder-keys
            defaultMode: 0440
        - name: state
          emptyDir: {}
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
