# Central mode with client certificate identity: the TLS LLM, forward proxy and tool proxy
# listeners, their Service and NetworkPolicy rule, the CA bundle and a CRL from ConfigMaps checked
# over the whole chain, OCSP with its egress rule, an operator listener certificate from a TLS
# Secret, and the edge listener accepting forwarder certificates.
identity:
  clientCertificates:
    enabled: true
    ca: {configMap: agents-ca}
    crls: {configMap: agents-crl, keys: [issuing.crl]}
    revocationScope: chain
    ocsp: {enabled: true, unreachable: soft-fail}
    agents:
      builder: "spiffe:spiffe://example.org/agents/builder"
      ci: "cn:ci-runner-* scope:secrets:list"
    serverNames: [scrim.example.org]
    listenerCertificate: {existingSecret: scrim-listener-tls}
    service: {type: LoadBalancer}
edge:
  enabled: true
agents:
  namespaces: [agents]
kyverno:
  enabled: true
networkPolicy:
  enabled: true
