<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="scrim">
  <title>scrim</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- The white bracket pairs are the placeholder delimiters, the same double
         brackets that wrap every scrim placeholder. -->
    <path d="M23 17 H13 V47 H23"/>
    <path d="M19.5 17 V47"/>
    <path d="M41 17 H51 V47 H41"/>
    <path d="M44.5 17 V47"/>
  </g>
  <!-- What sits between them is masked: the bar is what the provider sees. -->
  <rect x="25" y="28" width="14" height="8" rx="2" fill="#fff" opacity="0.85"/>
</svg>
