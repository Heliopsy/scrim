<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="scrim">
  <title>scrim</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- The scrim: a gauze curtain hung inside the placeholder, translucent with
       two folds and a loose hem. What sits behind it stays hidden. -->
  <path fill="#fff" fill-opacity=".24" d="M17 16H47V43C42.5 47.5 37 47.5 32 44C27 40.5 21.5 40.5 17 45Z"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="3" stroke-opacity=".9" d="M26 16C23.5 24 28 32 25.6 42.2M38 16C35.5 24 40 33 38.6 46"/>
    <!-- The brackets are the delimiters that wrap every scrim placeholder. -->
    <path stroke-width="6" d="M22 13H13V51H22M42 13H51V51H42"/>
  </g>
</svg>
