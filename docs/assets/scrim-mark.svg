<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="scrim">
  <title>scrim</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- The scrim: a gauze curtain hung from a rod inside the placeholder,
       translucent, with two folds and a loose hem. What sits behind it stays
       hidden. -->
  <clipPath id="c">
    <path id="veil" d="M20 18H44V43.5C40 47.5 36.5 47.5 32 44.5C27.5 41.5 24 41.5 20 45.5Z"/>
  </clipPath>
  <use href="#veil" fill="#fff" fill-opacity=".24"/>
  <path clip-path="url(#c)" fill="none" stroke="#fff" stroke-width="2.4" stroke-opacity=".7"
        d="M26 16C23.5 25 28 33 25.5 50M38 16C35.5 25 40 33 37.5 50"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- The curtain rod. -->
    <path stroke-width="3" d="M20.5 17.5H43.5"/>
    <!-- The brackets are the delimiters that wrap every scrim placeholder. -->
    <path stroke-width="6" d="M22 13H13V51H22M42 13H51V51H42"/>
  </g>
</svg>
