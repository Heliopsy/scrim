// SPDX-License-Identifier: AGPL-3.0-only

// The boundary between the scrim control plane (Go) and data plane (Rust),
// design D12.
//
// Transport: gRPC over one end of a socketpair the control plane creates and
// the data plane inherits (D11). The data plane is the gRPC server; the
// control plane is the only client. Nothing else can reach the socket.
//
// Off the hot path: the control plane pushes versioned snapshots and the data
// plane decides allow and deny locally. Only Asks waits on the control plane,
// and only for requests a rule sends to a human.
//
// Versioning: every top-level message carries `protocol` as field 1. Each side
// refuses a message whose protocol differs from its own PROTOCOL_VERSION
// (status FAILED_PRECONDITION), and the control plane refuses to start a data
// plane whose Hello reports a different one. A change that an older peer
// would misread bumps PROTOCOL_VERSION; both sides and their tests change in
// the same commit.
//
// Secrets: ValueEntry.value, PlaceholderKey.key, CaptureRequest.value and
// CaCertificate.key_pem are the only fields that hold secret material.
// Generated debug printers for those messages are replaced by redacting ones
// on both sides; neither may be logged, echoed in an error or copied into an
// event.
syntax = "proto3";

package scrim.dataplane.v1;

option go_package = "github.com/heliopsy/scrim/internal/dataplane/dataplanev1;dataplanev1";

// ProtocolVersion is the boundary protocol version.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  // PROTOCOL_VERSION_CURRENT is the version both sides of this build speak.
  PROTOCOL_VERSION_CURRENT = 1;
}

service DataPlane {
  // Hello is the first call on a new connection. The data plane answers with
  // its own protocol and build; the control plane stops it on a mismatch.
  rpc Hello(HelloRequest) returns (HelloResponse);

  // ApplySnapshot replaces the data plane's whole configuration atomically.
  // A snapshot whose version is not greater than the applied one, or that
  // fails validation, is rejected and the previous one stays in force.
  rpc ApplySnapshot(Snapshot) returns (ApplySnapshotResponse);

  // Events streams audit-relevant events in batches until the connection
  // closes. There is one subscriber, the control plane.
  rpc Events(EventsRequest) returns (stream EventBatch);

  // Asks carries "ask" decisions. The control plane opens the call once; the
  // data plane sends an AskRequest for each held operation and the control
  // plane answers each with an AskAnswer carrying the same id. An operation
  // with no answer by its deadline, or when the call ends, is denied.
  rpc Asks(stream AskAnswer) returns (stream AskRequest);

  // Status reports readiness and what is applied, for health and scrim status.
  rpc Status(StatusRequest) returns (StatusResponse);

  // Captures carries values a tool-proxy capture rule took from a response
  // (a token an API just issued). The control plane opens the call once; the
  // data plane sends a CaptureRequest and the control plane writes the value
  // to its store and answers with the placeholder the agent sees. A request
  // with no answer by its deadline, an error answer, or no attached control
  // plane withholds the field from the agent.
  rpc Captures(stream CaptureResult) returns (stream CaptureRequest);
}

message HelloRequest {
  uint32 protocol = 1;
  // control_plane_version is the scrim build version, for logs.
  string control_plane_version = 2;
}

message HelloResponse {
  uint32 protocol = 1;
  // data_plane_version is the scrim-dataplane build version.
  string data_plane_version = 2;
  // pid is the data plane's process id as it sees itself.
  uint32 pid = 3;
  // applied_snapshot_version is 0 until a snapshot is applied. A restarted
  // data plane always reports 0, so the control plane pushes again.
  uint64 applied_snapshot_version = 4;
  // memory_locked reports whether mlockall succeeded.
  bool memory_locked = 5;
  // dumpable is false when core dumps and ptrace attach are disabled.
  bool dumpable = 6;
}

// Snapshot is everything the data plane needs to serve traffic.
message Snapshot {
  uint32 protocol = 1;
  // version increases with every snapshot the control plane builds.
  uint64 version = 2;
  // values is the value dictionary: every known secret value to redact and,
  // for credentials, to inject toward bound hosts.
  repeated ValueEntry values = 3;
  // placeholder_keys are the HMAC keys placeholders are derived with (D3).
  // Exactly one is current; older ones keep resolving.
  repeated PlaceholderKey placeholder_keys = 4;
  // policy is the compiled policy the data plane decides with.
  Policy policy = 5;
  // routes map incoming provider traffic to upstreams.
  repeated Route routes = 6;
  // listeners are the sockets the data plane serves.
  repeated Listener listeners = 7;
  // redaction holds matcher settings.
  RedactionSettings redaction = 8;
  // capture_rules apply to tool-proxy responses.
  repeated CaptureRule capture_rules = 9;
  // restore is the restore policy for placeholders in responses (redaction
  // spec "Resolution follows tool policy", "Tool aliases", "Display modes",
  // "Share and reveal"; dataplane/crates/scrim-policy/README.md). Absent,
  // nothing is restored: every placeholder reaches the agent unresolved.
  RestoreSettings restore = 10;
  // tool_proxy_ca is the interception CA the control plane holds (design
  // D5). Exactly one entry is current: the tool proxy signs leaves with it.
  // A second, non-current entry is the previous generation during a
  // rotation's overlap: clients may still trust only it, so leaves are
  // served with a cross certificate until it leaves the snapshot. Empty
  // means the data plane keeps the CA it has (generating an ephemeral one
  // when it has none).
  repeated CaCertificate tool_proxy_ca = 11;
}

// CaCertificate is one generation of the tool-proxy CA.
message CaCertificate {
  // cert_pem is the self-signed CA certificate, PEM. Public.
  string cert_pem = 1;
  // key_pem is the CA's PKCS#8 private key, PEM. Secret: never logged,
  // wiped on both sides after use.
  bytes key_pem = 2;
  // current marks the generation leaves are signed with.
  bool current = 3;
}

// DisplayMode decides placeholders in text the agent displays (assistant
// text and refusals). Tool-call arguments follow the tool roles either way.
enum DisplayMode {
  // DISPLAY_MODE_UNSPECIFIED is treated as PLACEHOLDERS, the safer mode.
  DISPLAY_MODE_UNSPECIFIED = 0;
  // DISPLAY_MODE_VALUES resolves display values in displayed text.
  DISPLAY_MODE_VALUES = 1;
  // DISPLAY_MODE_PLACEHOLDERS keeps placeholders in displayed text, for
  // example while screen sharing.
  DISPLAY_MODE_PLACEHOLDERS = 2;
}

// ToolRole is what a tool does with its arguments, which decides what may be
// restored into them. Credentials are never restored, whatever the role.
enum ToolRole {
  // TOOL_ROLE_UNSPECIFIED is treated as NONE.
  TOOL_ROLE_UNSPECIFIED = 0;
  // TOOL_ROLE_NONE: nothing is restored (unknown tools).
  TOOL_ROLE_NONE = 1;
  // TOOL_ROLE_READ: reads files or directories; display values are restored.
  TOOL_ROLE_READ = 2;
  // TOOL_ROLE_SEARCH: searches files; display values are restored.
  TOOL_ROLE_SEARCH = 3;
  // TOOL_ROLE_SHELL: runs a shell command; display values are restored into
  // the command only where escaping keeps them data (redaction spec
  // "Context-aware escaping").
  TOOL_ROLE_SHELL = 4;
  // TOOL_ROLE_EDIT: changes part of an existing file; a value is restored
  // only where the call shows it is already in that file.
  TOOL_ROLE_EDIT = 5;
  // TOOL_ROLE_WRITE: writes whole files; nothing is restored.
  TOOL_ROLE_WRITE = 6;
  // TOOL_ROLE_NETWORK: can reach the network; nothing is restored.
  TOOL_ROLE_NETWORK = 7;
}

// ToolAlias gives a tool name a role, adding to or overriding the built-in
// tool table.
message ToolAlias {
  // name is the tool name exactly as the model calls it.
  string name = 1;
  ToolRole role = 2;
  // command_field is the argument holding the command for SHELL: a string is
  // a shell script, an array of strings an argv. Empty means `command`. When
  // the tool's input is not a JSON object, the whole input is the script.
  string command_field = 3;
  // old_fields and new_fields name the arguments holding replaced and
  // replacement text for EDIT, at any depth. Empty means `old_string` and
  // `old_str`, and `new_string` and `new_str`. Inputs in apply_patch format
  // (`*** Begin Patch`) are recognised without them.
  repeated string old_fields = 4;
  repeated string new_fields = 5;
}

message RestoreSettings {
  DisplayMode display_mode = 1;
  // tools are tool aliases; a name listed twice rejects the snapshot.
  repeated ToolAlias tools = 2;
  // builtin_tools_disabled ignores the built-in tool table, so only `tools`
  // have roles.
  bool builtin_tools_disabled = 3;
  // extra_shell_data_commands adds commands that a SHELL restore may feed
  // values to, beyond the built-in list of commands that take no code and
  // run nothing. Weakening: a listed command that interprets an argument as
  // code turns a restored value into code.
  repeated string extra_shell_data_commands = 4;
  // reveal_credential_refs are glob patterns over ValueEntry.ref of
  // credentials `scrim reveal` may resolve locally. Empty means reveal never
  // resolves credentials. Weakening. Restore into responses never resolves
  // credentials, whatever this holds.
  repeated string reveal_credential_refs = 5;
}

// ValueClass decides how a value is restored (D5).
enum ValueClass {
  // VALUE_CLASS_UNSPECIFIED is treated as CREDENTIAL, the stricter class.
  VALUE_CLASS_UNSPECIFIED = 0;
  // VALUE_CLASS_CREDENTIAL is never restored into commands, files or tool
  // arguments; it is injected only on connections to its bound hosts.
  VALUE_CLASS_CREDENTIAL = 1;
  // VALUE_CLASS_DISPLAY may be restored under the per-tool restore policy.
  VALUE_CLASS_DISPLAY = 2;
}

message ValueEntry {
  // ref is the store reference the value was read from, for example
  // `bao://kv/agents/github#token`. Safe to log.
  string ref = 1;
  // slug is the reference slug placeholders carry (`scrim:<slug>:<hmac>`).
  string slug = 2;
  // value is the secret. Never logged; wiped on both sides after use.
  bytes value = 3;
  ValueClass class = 4;
  // bound_hosts are the hosts (exact or `*.suffix`) a credential may be
  // injected toward. Empty means nowhere.
  repeated string bound_hosts = 5;
  // name is the catalog name, if the secret has one.
  string name = 6;
  // store is the store instance the value came from.
  string store = 7;
  // declared_placeholders are user-declared placeholder strings standing for
  // this value (for example `SCRIM_ACME_KEY`), unique across the snapshot.
  // Safe to log.
  repeated string declared_placeholders = 8;
  // bound_methods restrict injection to these HTTP methods. Empty allows all.
  repeated string bound_methods = 9;
  // bound_paths restrict injection to these path globs (`*` matches any run,
  // including `/`). Empty allows all.
  repeated string bound_paths = 10;
  // inject_locations are the request parts the placeholder may be replaced
  // in: `header`, `header:<name>`, `cookie`, `query`, `path`, `body`,
  // `anywhere`. Empty means `header`.
  repeated string inject_locations = 11;
  // allow_plaintext_http also injects over plain `http://`. Weakening.
  bool allow_plaintext_http = 12;
}

// CaptureRule stores a value an API returns (a newly created token) under
// `store_ref` and hands the agent its placeholder instead.
message CaptureRule {
  string name = 1;
  // hosts the request goes to (exact or `*.suffix`, optional `:port`).
  repeated string hosts = 2;
  // methods of the request; empty matches all.
  repeated string methods = 3;
  // path glob of the request; empty matches all.
  string path = 4;
  // status codes of the response; empty matches every 2xx.
  repeated uint32 status = 5;
  // Exactly one of json_pointer (RFC 6901, into a JSON body) and header.
  string json_pointer = 6;
  string header = 7;
  // store_ref is the reference the value is written to.
  string store_ref = 8;
}

message PlaceholderKey {
  // version is embedded in placeholders derived with this key.
  uint32 version = 1;
  // key is the HMAC key. Secret.
  bytes key = 2;
  // current marks the key new placeholders are derived with.
  bool current = 3;
}

// Effect is a policy decision. The zero value denies.
enum Effect {
  EFFECT_UNSPECIFIED = 0;  // treated as deny
  EFFECT_DENY = 1;
  EFFECT_ASK = 2;
  EFFECT_ALLOW = 3;
}

message Policy {
  // version identifies the policy the control plane compiled.
  uint64 version = 1;
  // engine names the format of `compiled`, for example `cel/v1`. Empty when
  // only `rules` is used.
  string engine = 2;
  // compiled is the engine's opaque program. A data plane that does not know
  // `engine` rejects the snapshot.
  bytes compiled = 3;
  // rules is the structured form for simple allow, deny and ask rules,
  // evaluated with deny over ask over allow.
  repeated PolicyRule rules = 4;
  // default_effect applies when no rule matches.
  Effect default_effect = 5;
  // break_glass denies every injection, restore and ask while redaction
  // continues.
  bool break_glass = 6;
  // table is the rule set compiled from CEL into a decision table (design
  // D7, docs/policy.md "How the data plane decides"), in rule order. When it
  // is set, `rules`, `engine` and `compiled` are empty.
  repeated TableRule table = 7;
  // table_format is the version of the table semantics; a data plane that
  // does not implement it rejects the snapshot. Currently 1. A policy with
  // no table, rules, engine or compiled program may leave it 0: it is an
  // empty table of the current format (default_effect and break_glass only).
  uint32 table_format = 8;
  // ask_timeout_millis bounds how long the data plane holds an operation
  // that went to the control plane (AskRequest) before it denies it. 0 means
  // 120000, the default of `approvals.timeout`.
  uint64 ask_timeout_millis = 9;
}

// TableRule is one rule in disjunctive normal form: it matches when any
// clause matches. The data plane evaluates every rule to match, no match or
// unknown, then for each effect in the order deny, ask, allow takes the
// first rule (in order) with that effect that is not a no-match: unknown
// sends the request to the control plane; otherwise deny denies, ask goes
// to the control plane, and allow allows unless control_plane is set. With
// no candidate, default_effect applies (ask goes to the control plane).
message TableRule {
  string name = 1;
  Effect effect = 2;
  // control_plane marks an allow rule with side effects (it leaves a grant
  // behind); when it decides, the control plane is asked instead.
  bool control_plane = 3;
  // clauses are alternatives; none means the rule never matches.
  repeated Clause clauses = 4;
  // reason is shown in approvals and audit.
  string reason = 5;
}

// Clause is a conjunction. Its result: false if any condition is false;
// otherwise unknown if residual; otherwise error if any condition errored;
// otherwise true. A rule is true if any clause is true, else unknown if any
// is unknown, else error if any errored, else false. A rule that errors
// counts as a match when its effect is deny or ask and as no match for
// allow.
message Clause {
  repeated Condition conditions = 1;
  // residual: the clause also has parts only the control plane evaluates.
  bool residual = 2;
}

enum ConditionOp {
  CONDITION_OP_UNSPECIFIED = 0;  // invalid; rejects the snapshot
  CONDITION_OP_IN = 1;           // operand equals one of values
  CONDITION_OP_PREFIX = 2;       // operand starts with values[0]
  CONDITION_OP_SUFFIX = 3;       // operand ends with values[0]
  CONDITION_OP_CONTAINS = 4;     // operand contains values[0]
  CONDITION_OP_GLOB = 5;         // operand matches glob values[0]
  CONDITION_OP_HAS_KEY = 6;      // map field has key; never errors
}

// Condition tests one request field.
message Condition {
  // field is one of: op, provider, agent.id, agent.kind, agent.known,
  // agent.session, agent.labels, secret.ref, secret.name, secret.store,
  // secret.class, secret.labels, dest.host, dest.method, dest.path,
  // tool.name, tool.command. agent.known is "true" or "false".
  string field = 1;
  // key selects an entry of a map field (agent.labels, secret.labels). Any
  // op but HAS_KEY on a missing key is an error.
  string key = 2;
  ConditionOp op = 3;
  repeated string values = 4;
  // negate inverts the result; an error stays an error.
  bool negate = 5;
}

message PolicyRule {
  string name = 1;
  Effect effect = 2;
  // Each list holds glob patterns (`*` matches within a segment, `**`
  // across); an empty list matches anything. A rule matches when every
  // non-empty list has a match.
  repeated string agents = 3;
  repeated string actions = 4;
  repeated string refs = 5;
  repeated string providers = 6;
  repeated string hosts = 7;
  repeated string tools = 8;
  // reason is shown in approvals and audit.
  string reason = 9;
}

message Route {
  // name identifies the route in events and status.
  string name = 1;
  // provider selects the codec: `anthropic`, `openai`, `gemini`, ...
  string provider = 2;
  // upstream is the base URL requests are forwarded to, possibly another
  // proxy in a chain.
  string upstream = 3;
  // hosts are the provider host names this route serves in forward-proxy
  // and transparent modes.
  repeated string hosts = 4;
  // path_prefix selects the route on a base-URL listener.
  string path_prefix = 5;
  // chain, when set, sends the redacted request to another proxy (for
  // example a context-compression proxy) in place of `upstream`.
  RouteChain chain = 6;
}

// RouteChain is a chained upstream that receives requests after redaction.
message RouteChain {
  // url is the chained proxy's base URL (`http` or `https`).
  string url = 1;
  // direct_on_unavailable sends the redacted request straight to the
  // route's upstream when the chained proxy cannot be reached. False refuses
  // the request instead.
  bool direct_on_unavailable = 2;
}

enum ListenerKind {
  LISTENER_KIND_UNSPECIFIED = 0;
  LISTENER_KIND_BASE_URL = 1;       // plain HTTP base URL for agents
  LISTENER_KIND_UNIX = 2;           // base URL on a Unix socket
  LISTENER_KIND_FORWARD_PROXY = 3;  // HTTP CONNECT proxy
  LISTENER_KIND_TRANSPARENT = 4;    // original-destination, routed by SNI
  LISTENER_KIND_TOOL_PROXY = 5;     // HTTPS tool proxy with credential injection
}

message Listener {
  string name = 1;
  ListenerKind kind = 2;
  // address is `host:port` or a Unix socket path.
  string address = 3;
}

message RedactionSettings {
  // min_value_length is the shortest value matched in free text; shorter
  // values are matched only in exact and encoded forms.
  uint32 min_value_length = 1;
}

message ApplySnapshotResponse {
  uint32 protocol = 1;
  // applied_version is the version now in force.
  uint64 applied_version = 2;
  // value_count is how many values the dictionary holds after the apply.
  uint32 value_count = 3;
}

message EventsRequest {
  uint32 protocol = 1;
}

message EventBatch {
  uint32 protocol = 1;
  repeated Event events = 2;
  // dropped counts events lost since the previous batch because the control
  // plane did not read fast enough. Never silently zero.
  uint64 dropped = 3;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_REDACTION = 1;      // values replaced in an outbound request
  EVENT_KIND_GUARD_REPAIR = 2;   // the guard repaired a request
  EVENT_KIND_GUARD_REFUSAL = 3;  // the guard withheld a request
  EVENT_KIND_DECISION = 4;       // a policy decision taken locally
  EVENT_KIND_INJECTION = 5;      // a credential injected toward a host
  EVENT_KIND_RESTORE = 6;        // a placeholder resolved into a tool argument
  EVENT_KIND_DETECTOR_HIT = 7;   // a fallback detector matched
  EVENT_KIND_ERROR = 8;          // a request failed closed
  EVENT_KIND_CAPTURE = 9;        // a capture rule stored a response value
  EVENT_KIND_INTERCEPTION_REFUSED = 10;  // a client refused scrim's certificate
}

// Event is metadata only: it names references and placeholders, never a
// value.
message Event {
  // seq increases per data plane process.
  uint64 seq = 1;
  // time_unix_nano is when it happened.
  int64 time_unix_nano = 2;
  EventKind kind = 3;
  string request_id = 4;
  string agent_id = 5;
  string provider = 6;
  string ref = 7;
  string rule = 8;
  Effect effect = 9;
  // target is the destination host, tool or command.
  string target = 10;
  string reason = 11;
  // count is how many occurrences the event covers (redactions in a body).
  uint32 count = 12;
  // snapshot_version is the snapshot in force.
  uint64 snapshot_version = 13;
  map<string, string> attrs = 14;
}

// PolicyRequest mirrors the control plane's policy request.
message PolicyRequest {
  string agent_id = 1;
  string action = 2;
  string ref = 3;
  string name = 4;
  string provider = 5;
  string host = 6;
  string method = 7;
  string path = 8;
  string tool = 9;
  // The rest of the request attributes rules see (docs/policy.md).
  string agent_kind = 10;
  string session = 11;
  map<string, string> agent_labels = 12;
  string store = 13;
  string secret_class = 14;
  map<string, string> secret_labels = 15;
  string command = 16;
}

message AskRequest {
  uint32 protocol = 1;
  // id is unique per data plane process; the answer echoes it.
  uint64 id = 2;
  PolicyRequest request = 3;
  // rule and reason come from the rule that asked.
  string rule = 4;
  string reason = 5;
  // deadline_unix_nano is when the data plane denies without an answer.
  int64 deadline_unix_nano = 6;
  // caller is what the transport told the data plane about who sent the
  // request. When it is set, the agent fields of `request` are empty: the
  // data plane cannot map it to an identity, and the control plane resolves
  // it before it evaluates the rules.
  AskCaller caller = 7;
}

// AskCaller is the transport identity of a request the data plane asks
// about. The data plane holds no session tokens and verifies none; the
// control plane decides what each part is worth.
message AskCaller {
  // session_id is the scrim session the request names: the user name of
  // `Proxy-Authorization: Basic` on the forward proxy, or the
  // `x-scrim-session` header on a base-URL listener. A claim, not verified.
  string session_id = 1;
  // unix_peer is set when the request came over a Unix socket listener;
  // peer_uid, peer_gid and peer_pid are the kernel's peer credentials then.
  bool unix_peer = 2;
  uint32 peer_uid = 3;
  uint32 peer_gid = 4;
  // peer_pid is 0 when the platform does not report it.
  int32 peer_pid = 5;
  // session_proof shows that the request carried the session's token, not
  // just its id (design D14). The client sends the token as the password of
  // `Proxy-Authorization: Basic <session_id>:<token>` or as the value of
  // `x-scrim-session` on a base-URL listener. The data plane never logs or
  // forwards it: it keeps only the verifier
  //   v = SHA-256("scrim session token v1\0" || secret)
  // where secret is the part of `scrim_st_<id>_<secret>` after the id, and
  // sends
  //   HMAC-SHA256(key = v, "scrim session proof v1\0" || session_id || "\0"
  //               || id (8 bytes, big-endian) || deadline_unix_nano (8 bytes, big-endian))
  // The control plane recomputes it from the hash it stores. The proof is
  // bound to this one ask and reveals neither the token nor v, so it is not
  // a secret field. Empty when the request named a session without its
  // token: such a caller is not verified and is evaluated as unknown.
  bytes session_proof = 6;
  // kubernetes_token is the projected Kubernetes service account token the
  // request carried instead of a session (design D14, "Kubernetes service
  // account tokens"): the password of `Proxy-Authorization: Basic k8s:<token>`
  // on the forward proxy, or a JWT as the value of `x-scrim-session` on a
  // base-URL listener. The control plane must see the token itself to verify
  // it (TokenReview), so unlike a session token it travels in the ask. It is
  // a secret field: redacted in Debug and zeroed on drop in scrim-proto,
  // wiped by the control plane after verification, never logged and never
  // forwarded. Empty when the request carried no such token.
  bytes kubernetes_token = 7;
}

message AskAnswer {
  uint32 protocol = 1;
  uint64 id = 2;
  // effect is ALLOW or DENY; anything else denies.
  Effect effect = 3;
  string reason = 4;
  // grant_id and grant_expires_unix_nano describe the grant an approval
  // created, for audit only. The data plane does not cache grants: the
  // control plane reads them on every use, so a revoked or used-up grant
  // takes effect on the next request (design D7).
  string grant_id = 5;
  int64 grant_expires_unix_nano = 6;
}

message StatusRequest {
  uint32 protocol = 1;
}

message StatusResponse {
  uint32 protocol = 1;
  // ready is true once a snapshot is applied and every listener is bound.
  bool ready = 2;
  uint64 applied_snapshot_version = 3;
  uint32 value_count = 4;
  bool memory_locked = 5;
  bool dumpable = 6;
  repeated ListenerStatus listeners = 7;
  string data_plane_version = 8;
  // ca_trust_bundle_pem holds the certificates of the tool-proxy CA that
  // clients must trust, PEM encoded; during a rotation both CAs. Public.
  string ca_trust_bundle_pem = 9;
  // tool_proxy is present once the tool proxy is built.
  ToolProxyStatus tool_proxy = 10;
  // redaction describes the value dictionary in force; absent before the
  // first snapshot.
  RedactionStatus redaction = 11;
  // policy_engine names how the data plane takes restore and injection
  // decisions, for example `standin/v1` (no rule table evaluation; display
  // values restored in text only, credentials never) or `table/v1` (the
  // decision table of format 1, scrim-policy).
  string policy_engine = 12;
}

// RedactionStatus reports counts and references, never values.
message RedactionStatus {
  // engine is the matcher in use: `aho-corasick` or `hash-window`.
  string engine = 1;
  // patterns is how many encoded variants are compiled.
  uint32 patterns = 2;
  // short_values counts values below the minimum length, matched only
  // whole.
  uint32 short_values = 3;
  // unprotected_refs are references whose values are below the floor and
  // are not redacted.
  repeated string unprotected_refs = 4;
  // duplicates counts entries whose value another entry already holds.
  uint32 duplicates = 5;
}

message ToolProxyStatus {
  // ready is true when a snapshot is applied and its redactor is ready.
  bool ready = 1;
  uint64 snapshot_version = 2;
  // unsupported_destinations maps destinations whose clients refused the
  // interception certificate to the TLS error.
  map<string, string> unsupported_destinations = 3;
  uint32 cached_leaves = 4;
}

message CaptureRequest {
  uint32 protocol = 1;
  // id is unique per data plane process; the result echoes it.
  uint64 id = 2;
  // rule names the capture rule that matched.
  string rule = 3;
  // ref is the store reference to write.
  string ref = 4;
  // destination is `scheme://host:port` the value came from.
  string destination = 5;
  // value is the captured secret. Never logged; wiped after the write.
  bytes value = 6;
  // deadline_unix_nano is when the data plane withholds the field instead.
  int64 deadline_unix_nano = 7;
}

message CaptureResult {
  uint32 protocol = 1;
  uint64 id = 2;
  // placeholder is what the agent sees in place of the value. Empty with
  // error set when the write failed.
  string placeholder = 3;
  // error says why the value was not stored, without the value.
  string error = 4;
}

message ListenerStatus {
  string name = 1;
  string address = 2;
  bool bound = 3;
  // error says why the listener is not bound.
  string error = 4;
  ListenerKind kind = 5;
}
