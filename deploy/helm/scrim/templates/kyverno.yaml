{{- /*
Kyverno policies of the policies.kyverno.io API (Kyverno 1.17 and later; 1.20
no longer creates kyverno.io/v1 ClusterPolicies). One ValidatingPolicy refuses
labelled pods outside agents.namespaces, one MutatingPolicy per mode injects
them. Every policy selects pods by the agent label in matchConstraints
.objectSelector, so the API server sends Kyverno only labelled pods, and
Kyverno generates no pod controller variants (an object selector turns autogen
off): a Deployment in Git stays as written, its pods are injected.

The mutations are JSON patches (an ApplyConfiguration may not set atomic lists
such as a volume's items or a container's args). They merge like the strategic
merge patch of the kyverno.io/v1 policy did: env and volumes by name, mounts by
mountPath, an entry of the pod with the same key is replaced. The values they
add are rendered as JSON into the policies' variables and read with
json.unmarshal, since CEL list and map literals must be homogeneous and a
container or volume is not.
*/ -}}
{{- if .Values.kyverno.enabled }}
{{- $label := .Values.agents.label }}
{{- $prefix := printf "%s-%s" (include "scrim.fullname" .) (include "scrim.namespace" .) }}
{{- $modes := list }}
{{- if .Values.central.enabled }}{{ $modes = append $modes "central" }}{{ end }}
{{- if .Values.sidecar.enabled }}{{ $modes = append $modes "sidecar" }}{{ end }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ $prefix }}-require-prepared-namespace
  labels:
    {{- include "scrim.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: scrim agent namespaces
    policies.kyverno.io/description: >-
      Pods labelled {{ $label }} are refused outside the namespaces the scrim chart prepared
      (agents.namespaces), or with a label value other than {{ join " or " $modes }}.
spec:
  failurePolicy: {{ .Values.kyverno.failurePolicy }}
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    objectSelector:
      matchExpressions:
        - key: {{ $label }}
          operator: Exists
  variables:
    - name: namespaces
      expression: {{ toJson (.Values.agents.namespaces | default list) | quote }}
    - name: modes
      expression: {{ toJson $modes | quote }}
  validations:
    - expression: >-
        request.namespace in variables.namespaces &&
        object.metadata.?labels[{{ toJson $label }}].orValue("") in variables.modes
      message: >-
        Pods labelled {{ $label }} must run in a namespace listed in the scrim chart's
        agents.namespaces (where its CA, environment and NetworkPolicies exist), with a label
        value of {{ join " or " $modes }}.
{{- if .Values.central.enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: {{ $prefix }}-inject-central
  labels:
    {{- include "scrim.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: scrim agent injection, central
    policies.kyverno.io/description: >-
      Pods labelled {{ $label }}=central get the base URLs, forward proxy and CA of the central
      scrim, the identity token and the scrim-exec launcher{{ if .Values.edge.enabled }}, and the edge
      forwarder for ssh-agent, database ports and the agent API{{ end }}.
{{- $env := include "scrim.centralAgentEnv" . | fromYamlArray }}
{{- $volumes := include "scrim.agentVolumes" . | fromYamlArray }}
{{- $mounts := include "scrim.agentMounts" . | fromYamlArray }}
{{- $init := list }}
{{- if .Values.edge.enabled }}
{{- $env = concat $env (include "scrim.edgeAgentEnv" . | fromYamlArray) }}
{{- $volumes = concat $volumes (include "scrim.edgeVolumes" . | fromYamlArray) }}
{{- $mounts = concat $mounts (include "scrim.edgeMounts" . | fromYamlArray) }}
{{- $init = include "scrim.edgeInitContainers" . | fromYamlArray }}
{{- end }}
spec:
  {{- include "scrim.kyverno.injectSpec" (dict "root" . "mode" "central"
        "env" $env "volumes" $volumes "mounts" $mounts "initContainers" $init) | nindent 2 }}
{{- end }}
{{- if .Values.sidecar.enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: {{ $prefix }}-inject-sidecar
  labels:
    {{- include "scrim.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: scrim agent injection, sidecar
    policies.kyverno.io/description: >-
      Pods labelled {{ $label }}=sidecar get an in-pod scrim as a native sidecar, the egress
      guard, and the environment, CA, identity token and scrim-exec launcher pointing at it.
spec:
  {{- include "scrim.kyverno.injectSpec" (dict "root" . "mode" "sidecar"
        "env" (include "scrim.sidecarAgentEnv" . | fromYamlArray)
        "volumes" (concat (include "scrim.agentVolumes" . | fromYamlArray) (include "scrim.sidecarVolumes" . | fromYamlArray))
        "initContainers" (include "scrim.sidecarInitContainers" . | fromYamlArray)) | nindent 2 }}
{{- end }}
{{- end }}
