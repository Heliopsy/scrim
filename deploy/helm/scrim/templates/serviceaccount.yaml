{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "scrim.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scrim.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ or .Values.serviceAccount.automountToken .Values.identity.kubernetes.enabled }}
{{- end }}
{{- if and .Values.identity.kubernetes.enabled .Values.identity.kubernetes.tokenReviewRBAC }}
---
# TokenReview, to verify the projected tokens agent pods present.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "scrim.fullname" . }}-{{ .Release.Namespace }}-tokenreview
  labels:
    {{- include "scrim.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "scrim.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
