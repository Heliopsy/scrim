{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "scrim.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scrim.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ or .Values.serviceAccount.automountToken .Values.identity.kubernetes.enabled }}
{{- end }}
{{- $k := .Values.identity.kubernetes }}
{{- if and $k.enabled $k.tokenReviewRBAC (or .Values.central.enabled .Values.sidecar.enabled) }}
{{- $name := printf "%s-%s-tokenreview" (include "scrim.fullname" .) .Release.Namespace }}
---
# TokenReview only, to verify the projected tokens agent pods present. Narrower than
# system:auth-delegator, which also allows SubjectAccessReviews.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "scrim.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "scrim.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  {{- if .Values.central.enabled }}
  - kind: ServiceAccount
    name: {{ include "scrim.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.sidecar.enabled }}
  {{- range .Values.agents.namespaces }}
  # The in-pod scrim runs as the agent pod's service account.
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:{{ . }}
  {{- end }}
  {{- end }}
{{- end }}
