{{- $a := .Values.central.autoscaling }}
{{- if and .Values.central.enabled $a.enabled }}
{{- if and (not $a.targetCPUUtilizationPercentage) (not $a.connections.enabled) }}
{{- fail "central.autoscaling needs targetCPUUtilizationPercentage or connections.enabled" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "scrim.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scrim.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "scrim.fullname" . }}
  minReplicas: {{ $a.minReplicas }}
  maxReplicas: {{ $a.maxReplicas }}
  metrics:
    {{- if $a.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $a.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $a.connections.enabled }}
    # Open data plane connections per replica (scrim_dataplane_connections_active summed over
    # listeners), served by a metrics adapter.
    - type: Pods
      pods:
        metric:
          name: {{ $a.connections.metricName }}
        target:
          type: AverageValue
          averageValue: {{ $a.connections.targetAverageValue | quote }}
    {{- end }}
  {{- with $a.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
