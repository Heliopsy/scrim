{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $label := .Values.agents.label }}
{{- if .Values.central.enabled }}
{{- /*
Central scrim, through chart.std.networkPolicy: agents reach the LLM and
forward proxy ports (and the edge listener with edge.enabled), Prometheus the metrics port, adminFrom the admin port,
issuerFrom (every source when empty) the issuer port with identity.issuer.enabled,
clientCertificatesFrom (every source when empty) the TLS listeners with
identity.clientCertificates.enabled,
the helm test pods the listeners; scrim reaches DNS, the API server
(TokenReview) and what networkPolicy.scrimEgress allows. central.networkPolicy
adds to it.
*/ -}}
{{- $listen := list (dict "port" 9790 "protocol" "TCP") (dict "port" 9791 "protocol" "TCP") -}}
{{- $agentNs := dict -}}
{{- if .Values.agents.namespaces -}}
  {{- $agentNs = dict "matchExpressions" (list (dict "key" "kubernetes.io/metadata.name" "operator" "In" "values" .Values.agents.namespaces)) -}}
{{- end -}}
{{- $agentPorts := $listen -}}
{{- if .Values.edge.enabled -}}
  {{- $agentPorts = append $agentPorts (dict "port" (int .Values.edge.port) "protocol" "TCP") -}}
{{- end -}}
{{- $ingress := list (dict "from" (list (dict "namespaceSelector" $agentNs "podSelector" (dict "matchLabels" (dict $label "central")))) "ports" $agentPorts) -}}
{{- if .Values.metrics.enabled -}}
  {{- $ingress = append $ingress (dict "from" (list (dict "namespaceSelector" $np.prometheus.namespaceSelector "podSelector" $np.prometheus.podSelector)) "ports" (list (dict "port" (int .Values.metrics.port) "protocol" "TCP"))) -}}
{{- end -}}
{{- if and .Values.admin.tcp.enabled $np.adminFrom -}}
  {{- $ingress = append $ingress (dict "from" $np.adminFrom "ports" (list (dict "port" (int .Values.admin.tcp.port) "protocol" "TCP"))) -}}
{{- end -}}
{{- $iss := .Values.identity.issuer -}}
{{- if $iss.enabled -}}
  {{- /* Public keys only: open to every source unless issuerFrom narrows it. */ -}}
  {{- $rule := dict "ports" (list (dict "port" (int $iss.port) "protocol" "TCP")) -}}
  {{- with $np.issuerFrom }}{{ $_ := set $rule "from" . }}{{ end -}}
  {{- $ingress = append $ingress $rule -}}
{{- end -}}
{{- if include "scrim.clientCertsOn" . -}}
  {{- $cc := .Values.identity.clientCertificates -}}
  {{- $tlsPorts := list (dict "port" (int $cc.llmPort) "protocol" "TCP") -}}
  {{- if $cc.forwardPort }}{{ $tlsPorts = append $tlsPorts (dict "port" (int $cc.forwardPort) "protocol" "TCP") }}{{ end -}}
  {{- $rule := dict "ports" $tlsPorts -}}
  {{- with $np.clientCertificatesFrom }}{{ $_ := set $rule "from" . }}{{ end -}}
  {{- $ingress = append $ingress $rule -}}
{{- end -}}
{{- if .Values.tests.enabled -}}
  {{- $testPorts := append $listen (dict "port" (int .Values.metrics.port) "protocol" "TCP") -}}
  {{- if $iss.enabled }}{{ $testPorts = append $testPorts (dict "port" (int $iss.port) "protocol" "TCP") }}{{ end -}}
  {{- $ingress = append $ingress (dict "from" (list (include "chart.netpolTestPeer" . | fromYaml)) "ports" $testPorts) -}}
{{- end -}}
{{- $egress := list (include "chart.netpolDNSEgress" . | fromYaml) -}}
{{- if .Values.identity.kubernetes.enabled -}}
  {{- $egress = concat $egress $np.apiServerEgress -}}
{{- end -}}
{{- $egress = concat $egress (default list $np.scrimEgress) -}}
{{- include "chart.std.networkPolicy" (dict "root" . "comp" "proxy" "name" (include "scrim.fullname" .) "ingress" $ingress "egress" $egress "extra" .Values.central.networkPolicy) }}
{{- end }}
{{- range $ns := .Values.agents.namespaces }}
{{- if $.Values.central.enabled }}
---
# Agent pods labelled {{ $label }}=central reach only scrim and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "scrim.fullname" $ }}-agents-central
  namespace: {{ $ns }}
  labels:
    {{- include "scrim.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{ $label }}: central
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ (include "scrim.namespace" $) }}
          podSelector:
            matchLabels:
              {{- include "scrim.selectorLabels" $ | nindent 14 }}
      ports:
        - port: 9790
          protocol: TCP
        - port: 9791
          protocol: TCP
        {{- if $.Values.edge.enabled }}
        # The edge forwarder.
        - port: {{ $.Values.edge.port }}
          protocol: TCP
        {{- end }}
    {{- include "scrim.dnsEgress" $np.dns | nindent 4 }}
    {{- with $np.agentEgress }}
    # networkPolicy.agentEgress: connections that do not go through scrim.
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if $.Values.sidecar.enabled }}
---
# Agent pods labelled {{ $label }}=sidecar: the pod reaches DNS and what the in-pod scrim
# needs. The egress guard keeps the agent's own processes on loopback.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "scrim.fullname" $ }}-agents-sidecar
  namespace: {{ $ns }}
  labels:
    {{- include "scrim.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{ $label }}: sidecar
  policyTypes: [Egress]
  egress:
    {{- include "scrim.dnsEgress" $np.dns | nindent 4 }}
    {{- if $.Values.identity.kubernetes.enabled }}
    # TokenReview from the in-pod scrim.
    {{- toYaml $np.apiServerEgress | nindent 4 }}
    {{- end }}
    {{- with $np.sidecarEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
