{{- /* SPDX-License-Identifier: AGPL-3.0-only */ -}}
{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $label := .Values.agents.label }}
{{- if .Values.central.enabled }}
{{- /*
Central scrim, through chart.std.networkPolicy: agents reach the LLM and
forward proxy ports, Prometheus the metrics port, adminFrom the admin port,
the helm test pods the listeners; scrim reaches DNS, the API server
(TokenReview) and what networkPolicy.scrimEgress allows. central.networkPolicy
adds to it.
*/ -}}
{{- $listen := list (dict "port" 9790 "protocol" "TCP") (dict "port" 9791 "protocol" "TCP") -}}
{{- $agentNs := dict -}}
{{- if .Values.agents.namespaces -}}
  {{- $agentNs = dict "matchExpressions" (list (dict "key" "kubernetes.io/metadata.name" "operator" "In" "values" .Values.agents.namespaces)) -}}
{{- end -}}
{{- $ingress := list (dict "from" (list (dict "namespaceSelector" $agentNs "podSelector" (dict "matchLabels" (dict $label "central")))) "ports" $listen) -}}
{{- if .Values.metrics.enabled -}}
  {{- $ingress = append $ingress (dict "from" (list (dict "namespaceSelector" $np.prometheus.namespaceSelector "podSelector" $np.prometheus.podSelector)) "ports" (list (dict "port" (int .Values.metrics.port) "protocol" "TCP"))) -}}
{{- end -}}
{{- if and .Values.admin.tcp.enabled $np.adminFrom -}}
  {{- $ingress = append $ingress (dict "from" $np.adminFrom "ports" (list (dict "port" (int .Values.admin.tcp.port) "protocol" "TCP"))) -}}
{{- end -}}
{{- if .Values.tests.enabled -}}
  {{- $ingress = append $ingress (dict "from" (list (include "chart.netpolTestPeer" . | fromYaml)) "ports" (append $listen (dict "port" (int .Values.metrics.port) "protocol" "TCP"))) -}}
{{- end -}}
{{- $egress := list (include "chart.netpolDNSEgress" . | fromYaml) -}}
{{- if .Values.identity.kubernetes.enabled -}}
  {{- $egress = concat $egress $np.apiServerEgress -}}
{{- end -}}
{{- $egress = concat $egress (default list $np.scrimEgress) -}}
{{- include "chart.std.networkPolicy" (dict "root" . "comp" "proxy" "name" (include "scrim.fullname" .) "ingress" $ingress "egress" $egress "extra" .Values.central.networkPolicy) }}
{{- end }}
{{- range $ns := .Values.agents.namespaces }}
{{- if $.Values.central.enabled }}
---
# Agent pods labelled {{ $label }}=central reach only scrim and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "scrim.fullname" $ }}-agents-central
  namespace: {{ $ns }}
  labels:
    {{- include "scrim.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{ $label }}: central
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ (include "scrim.namespace" $) }}
          podSelector:
            matchLabels:
              {{- include "scrim.selectorLabels" $ | nindent 14 }}
      ports:
        - port: 9790
          protocol: TCP
        - port: 9791
          protocol: TCP
    {{- include "scrim.dnsEgress" $np.dns | nindent 4 }}
{{- end }}
{{- if $.Values.sidecar.enabled }}
---
# Agent pods labelled {{ $label }}=sidecar: the pod reaches DNS and what the in-pod scrim
# needs. The egress guard keeps the agent's own processes on loopback.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "scrim.fullname" $ }}-agents-sidecar
  namespace: {{ $ns }}
  labels:
    {{- include "scrim.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{ $label }}: sidecar
  policyTypes: [Egress]
  egress:
    {{- include "scrim.dnsEgress" $np.dns | nindent 4 }}
    {{- if $.Values.identity.kubernetes.enabled }}
    # TokenReview from the in-pod scrim.
    {{- toYaml $np.apiServerEgress | nindent 4 }}
    {{- end }}
    {{- with $np.sidecarEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
