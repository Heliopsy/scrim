{{- $metricsOff := not .Values.metrics.enabled }}
{{- if and $metricsOff (or .Values.serviceMonitor.enabled .Values.podMonitor.enabled) }}
{{- fail "serviceMonitor and podMonitor need metrics.enabled=true" }}
{{- end }}
{{- if and .Values.serviceMonitor.enabled .Values.central.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "scrim.fullname" . }}
  namespace: {{ (include "scrim.namespace" $) }}
  labels:
    {{- include "scrim.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "scrim.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: {{ .Values.metrics.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      {{- include "scrim.scrapeAuth" . | nindent 6 }}
{{- end }}
{{- if and .Values.podMonitor.enabled .Values.sidecar.enabled }}
{{- range $ns := .Values.agents.namespaces }}
---
# Sidecars in {{ $ns }}. The bearer token Secret, if any, must exist in this namespace.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "scrim.fullname" $ }}-sidecars
  namespace: {{ $ns }}
  labels:
    {{- include "scrim.labels" $ | nindent 4 }}
    {{- with $.Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{ $.Values.agents.label }}: sidecar
  podMetricsEndpoints:
    - port: scrim-health
      path: {{ $.Values.metrics.path }}
      interval: {{ $.Values.podMonitor.interval }}
      {{- include "scrim.scrapeAuth" $ | nindent 6 }}
{{- end }}
{{- end }}
{{- if .Values.prometheusRule.enabled }}
{{- /* monitoring/scrim.rules.yaml is a copy of deploy/monitoring/rules/scrim.rules.yaml, kept equal by test/k8s/golden.sh. */}}
{{- $bundled := .Files.Get "monitoring/scrim.rules.yaml" | fromYaml }}
{{- if not (get $bundled "groups") }}
{{- fail "prometheusRule.enabled: the chart's monitoring/scrim.rules.yaml is missing or has no groups" }}
{{- end }}
{{- $groups := concat (get $bundled "groups") .Values.prometheusRule.groups }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "scrim.fullname" . }}
  namespace: {{ (include "scrim.namespace" $) }}
  labels:
    {{- include "scrim.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- toYaml $groups | nindent 4 }}
{{- end }}
{{- if .Values.grafanaDashboard.enabled }}
{{- /* monitoring/scrim-dashboard.json is a copy of deploy/monitoring/grafana/scrim-dashboard.json. */}}
{{- $json := .Values.grafanaDashboard.json | default (.Files.Get "monitoring/scrim-dashboard.json") }}
{{- if not $json }}
{{- fail "grafanaDashboard.enabled: the chart's monitoring/scrim-dashboard.json is missing and grafanaDashboard.json is empty" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scrim.fullname" . }}-dashboard
  namespace: {{ (include "scrim.namespace" $) }}
  labels:
    {{- include "scrim.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  scrim.json: |
    {{- $json | nindent 4 }}
{{- end }}
