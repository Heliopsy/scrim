{{- if .Values.central.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scrim.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scrim.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  {{- with .Values.central.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.central.service.type }}
  selector:
    {{- include "scrim.selectorLabels" . | nindent 4 }}
  ports:
    - name: llm
      port: {{ .Values.central.service.llmPort }}
      targetPort: llm
      protocol: TCP
      appProtocol: http
    - name: forward
      port: {{ .Values.central.service.forwardPort }}
      targetPort: forward
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      appProtocol: http
    {{- end }}
    {{- if .Values.admin.tcp.enabled }}
    - name: admin
      port: {{ .Values.admin.tcp.port }}
      targetPort: admin
      protocol: TCP
      appProtocol: http
    {{- end }}
{{- end }}
