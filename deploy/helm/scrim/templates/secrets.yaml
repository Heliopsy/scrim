{{- /* SPDX-License-Identifier: AGPL-3.0-only */ -}}
{{- /*
Secret slots (templates/_helpers.tpl, "Secrets"). admin and postgres are
inputs: an existing Secret or an ExternalSecret, never generated
(validate.yaml refuses them missing). metrics is generated on first install
and kept, unless secrets.existing.metrics or an ExternalSecret supplies it.
*/ -}}
{{- if .Values.central.enabled }}
{{- if and .Values.admin.tcp.enabled (include "scrim.slotSupplied" (list . "admin")) }}
{{- include "chart.secret" (dict "root" . "slot" "admin" "values" .Values.central "keys" (list (dict "name" "token" "required" true))) }}
{{- end }}
{{- if and .Values.postgres.enabled (include "scrim.slotSupplied" (list . "postgres")) }}
{{- include "chart.secret" (dict "root" . "slot" "postgres" "values" .Values.central "keys" (list (dict "name" "dsn" "required" true))) }}
{{- end }}
{{- if and .Values.metrics.enabled (not .Values.metrics.allowUnauthenticatedRemote) }}
{{- include "chart.secret" (dict "root" . "slot" "metrics" "values" .Values.central "keys" (list (dict "name" "token" "generate" true "length" 48))) }}
{{- end }}
{{- end }}
