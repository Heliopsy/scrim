{{- /* SPDX-License-Identifier: AGPL-3.0-only */ -}}
{{- /* Combinations the schema cannot express. Renders nothing. */ -}}
{{- include "scrim.checkConfig" . -}}
{{- include "scrim.checkScale" . -}}
{{- range $k, $c := .Values.extraConfigMaps -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $k) -}}
{{- fail (printf "extraConfigMaps: key %q must be a DNS label (it becomes part of the ConfigMap name)" $k) -}}
{{- end -}}
{{- if and $c $c.existingConfigMap (or $c.data $c.binaryData) -}}
{{- fail (printf "extraConfigMaps.%s: set either existingConfigMap or data/binaryData, not both" $k) -}}
{{- end -}}
{{- end -}}
{{- range $k, $_ := .Values.global.extraSelectorLabels -}}
{{- if or (hasKey (default dict $.Values.commonLabels) $k) (hasKey (default dict $.Values.global.commonLabels) $k) -}}
{{- fail (printf "global.extraSelectorLabels.%s is also a commonLabels key: set it in one place" $k) -}}
{{- end -}}
{{- end -}}
{{- /*
The template refuses a ServiceMonitor and a PodMonitor together because both
would scrape the same pods. Here they never do: the ServiceMonitor scrapes
central scrim, the PodMonitor the sidecars. What is refused instead is a
monitor with nothing to scrape.
*/ -}}
{{- if .Values.edge.enabled -}}
{{- if not .Values.central.enabled -}}
{{- fail "edge.enabled forwards agent pods to central scrim, which central.enabled=false does not deploy" -}}
{{- end -}}
{{- if not .Values.identity.kubernetes.enabled -}}
{{- fail "edge.enabled needs identity.kubernetes.enabled: central scrim identifies each forwarder by its pod's projected service account token" -}}
{{- end -}}
{{- if not (or .Values.edge.sshAgent .Values.edge.api .Values.edge.databases) -}}
{{- fail "edge.enabled with nothing to forward: turn on edge.sshAgent or edge.api, or list edge.databases" -}}
{{- end -}}
{{- $taken := list 9790 9791 (int .Values.metrics.port) -}}
{{- if .Values.admin.tcp.enabled }}{{ $taken = append $taken (int .Values.admin.tcp.port) }}{{ end -}}
{{- if has (int .Values.edge.port) $taken -}}
{{- fail (printf "edge.port %v is taken by another scrim listener" .Values.edge.port) -}}
{{- end -}}
{{- if and .Values.edge.ca.existingSecret (eq .Values.edge.ca.existingSecret (include "scrim.caSecretName" .)) -}}
{{- fail (printf "edge.ca.existingSecret %q is the interception CA's Secret; the edge CA needs a key of its own" .Values.edge.ca.existingSecret) -}}
{{- end -}}
{{- $cfgDBs := default dict (index (default dict .Values.config) "databases") -}}
{{- range $name, $port := .Values.edge.databases -}}
{{- if and (not $.Values.existingConfigMap) (not (hasKey $cfgDBs $name)) -}}
{{- fail (printf "edge.databases.%s: no database %q in config.databases" $name $name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and .Values.serviceMonitor.enabled (not .Values.central.enabled) -}}
{{- fail "serviceMonitor.enabled scrapes central scrim, which central.enabled=false does not deploy; use podMonitor for sidecars" -}}
{{- end -}}
{{- if and .Values.podMonitor.enabled (not .Values.sidecar.enabled) -}}
{{- fail "podMonitor.enabled scrapes sidecars, which sidecar.enabled=false does not inject; use serviceMonitor for central scrim" -}}
{{- end -}}
{{- if and .Values.secrets.externalSecrets.enabled (not .Values.secrets.externalSecrets.secretStoreRef.name) -}}
{{- fail "secrets.externalSecrets.enabled needs secrets.externalSecrets.secretStoreRef.name" -}}
{{- end -}}
{{- range $slot, $_ := .Values.secrets.existing -}}
{{- if not (has $slot (list "admin" "metrics" "postgres" "valkey" "nats" "otlp" "loki" "kafka")) -}}
{{- fail (printf "secrets.existing.%s: no such slot (admin, metrics, postgres, valkey, nats, otlp, loki, kafka)" $slot) -}}
{{- end -}}
{{- end -}}
