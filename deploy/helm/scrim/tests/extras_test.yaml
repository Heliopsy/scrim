# SPDX-License-Identifier: AGPL-3.0-only
suite: extension points (extra-configmaps.yaml, extra-objects.yaml)
templates:
  - extra-configmaps.yaml
  - extra-objects.yaml
release:
  name: rel
  namespace: ns
tests:
  - it: nothing by default
    asserts:
      - hasDocuments: {count: 0}
  - it: extraConfigMaps are tpl-rendered and take objectMetadata and replication
    template: extra-configmaps.yaml
    set:
      extraConfigMaps: {notes: {data: {a: "{{ .Release.Name }}"}, replication: {mode: reflector}}}
      objectMetadata: {ConfigMap/notes: {labels: {x: y}}}
    asserts:
      - equal: {path: metadata.name, value: rel-scrim-notes}
      - equal: {path: data.a, value: rel}
      - equal: {path: metadata.labels.x, value: y}
      - equal: {path: 'metadata.annotations["reflector.v1.k8s.emberstack.com/reflection-allowed"]', value: "true"}
  - it: an existing ConfigMap renders nothing
    template: extra-configmaps.yaml
    set:
      extraConfigMaps: {notes: {existingConfigMap: mine}}
    asserts:
      - hasDocuments: {count: 0}
  - it: extraObjects are rendered through tpl
    template: extra-objects.yaml
    set:
      extraObjects:
        - {apiVersion: v1, kind: ConfigMap, metadata: {name: '{{ .Release.Name }}-x'}}
    asserts:
      - equal: {path: metadata.name, value: rel-x}
