# SPDX-License-Identifier: AGPL-3.0-only
suite: monitoring (monitoring.yaml)
templates:
  - monitoring.yaml
release:
  name: rel
  namespace: ns
set:
  metrics.enabled: true
tests:
  - it: nothing by default
    asserts:
      - hasDocuments: {count: 0}
  - it: the ServiceMonitor presents the slot token
    set:
      serviceMonitor: {enabled: true, labels: {release: kps}}
    asserts:
      - isKind: {of: ServiceMonitor}
      - equal: {path: metadata.labels.release, value: kps}
      - equal: {path: 'spec.endpoints[0].port', value: metrics}
      - equal: {path: 'spec.endpoints[0].authorization.credentials', value: {name: rel-scrim-metrics, key: token}}
  - it: no authorization with the weakening
    set:
      metrics.allowUnauthenticatedRemote: true
      serviceMonitor.enabled: true
    asserts:
      - notExists: {path: 'spec.endpoints[0].authorization'}
  - it: a PodMonitor per agent namespace for sidecars
    set:
      sidecar: {enabled: true, egressGuard: {image: nft:1}}
      secrets.existing.metrics: scrim-metrics
      agents.namespaces: [a, b]
      podMonitor.enabled: true
    asserts:
      - hasDocuments: {count: 2}
      - isKind: {of: PodMonitor}
      - equal: {path: metadata.namespace, value: b}
        documentIndex: 1
  - it: the PrometheusRule carries the bundled rules plus extra groups
    set:
      prometheusRule: {enabled: true, groups: [{name: extra, rules: [{alert: X, expr: vector(1)}]}]}
    asserts:
      - isKind: {of: PrometheusRule}
      - equal: {path: 'spec.groups[0].name', value: scrim.availability}
      - contains: {path: spec.groups, content: {name: extra, rules: [{alert: X, expr: vector(1)}]}}
  - it: the dashboard ConfigMap carries the bundled dashboard
    set:
      grafanaDashboard.enabled: true
    asserts:
      - isKind: {of: ConfigMap}
      - equal: {path: 'metadata.labels.grafana_dashboard', value: "1"}
      - matchRegex: {path: 'data["scrim.json"]', pattern: '"uid": "scrim-overview"'}
