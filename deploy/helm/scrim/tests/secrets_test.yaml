# SPDX-License-Identifier: AGPL-3.0-only
suite: Secret slots and placeholder keys (secrets.yaml, placeholder-keys.yaml, ca.yaml)
templates:
  - secrets.yaml
  - placeholder-keys.yaml
  - ca.yaml
release:
  name: rel
  namespace: ns
tests:
  - it: no slot Secret by default
    template: secrets.yaml
    asserts:
      - hasDocuments: {count: 0}
  - it: generates and keeps the metrics token
    template: secrets.yaml
    set:
      metrics.enabled: true
    asserts:
      - isKind: {of: Secret}
      - equal: {path: metadata.name, value: rel-scrim-metrics}
      - equal: {path: 'metadata.labels["scrim.dev/secret-slot"]', value: metrics}
      - equal: {path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep}
      - exists: {path: data.token}
  - it: an existing Secret renders nothing
    template: secrets.yaml
    set:
      metrics.enabled: true
      secrets.existing.metrics: mine
    asserts:
      - hasDocuments: {count: 0}
  - it: an ExternalSecret per mapped slot
    template: secrets.yaml
    set:
      postgres.enabled: true
      admin.tcp.enabled: true
      secrets.externalSecrets: {enabled: true, secretStoreRef: {name: vault, kind: ClusterSecretStore}, data: {postgres: {dsn: scrim/dsn}, admin: {token: scrim/admin}}}
    asserts:
      - hasDocuments: {count: 2}
      - isKind: {of: ExternalSecret}
      - equal: {path: 'spec.data[0].remoteRef.key', value: scrim/admin}
        documentIndex: 0
  - it: the placeholder key is generated once and kept
    template: placeholder-keys.yaml
    asserts:
      - equal: {path: metadata.name, value: rel-scrim-placeholder-keys}
      - equal: {path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep}
      - exists: {path: data.k1}
  - it: an existing key Secret renders nothing
    template: placeholder-keys.yaml
    set:
      placeholderKeys.existingSecret: mine
    asserts:
      - hasDocuments: {count: 0}
  - it: the generated CA is a kept TLS Secret
    template: ca.yaml
    documentSelector: {path: kind, value: Secret}
    asserts:
      - equal: {path: type, value: kubernetes.io/tls}
      - equal: {path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep}
