#
# One release of the chart from the OCIRepository next to it. The values are
# an example; anything in docs/helm-values.md goes here or in valuesFrom.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrim
  namespace: flux-system
spec:
  releaseName: scrim
  targetNamespace: scrim
  storageNamespace: scrim
  chartRef:
    kind: OCIRepository
    name: scrim-chart
    namespace: flux-system
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    # Roll back to the last good revision when an upgrade fails, then retry.
    remediation:
      retries: 3
      strategy: rollback
  values:
    agents:
      namespaces: [agents]
    kyverno:
      enabled: true
    networkPolicy:
      enabled: true
