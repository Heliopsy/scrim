#
# The chart as the release publishes it: oci://ghcr.io/heliopsy/charts/scrim,
# version = the scrim release without its "v", signed keyless (Sigstore) by
# .github/workflows/release.yaml, the same identity as the images. Flux refuses
# an unsigned artifact or one signed by another workflow.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: scrim-chart
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/heliopsy/charts/scrim
  ref:
    # Any 1.x release; raise the bound deliberately for a new major. For a
    # pinned install use the exact tag and the digest from the GitHub release
    # instead; the digest wins:
    #   tag: "1.0.0"
    #   digest: sha256:<digest>
    semver: ">=1.0.0 <2.0.0"
  # Only the chart layer, as the tarball helm-controller expects.
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/Heliopsy/scrim/\.github/workflows/release\.yaml@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+.*|heads/main)$
