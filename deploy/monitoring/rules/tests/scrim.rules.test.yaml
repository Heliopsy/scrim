# promtool unit tests for rules/scrim.rules.yaml.
# Run: promtool test rules deploy/monitoring/rules/tests/scrim.rules.test.yaml
rule_files:
- ../scrim.rules.yaml
evaluation_interval: 1m
tests:
- name: ScrimDown fires when the target is down, ignores other jobs
  interval: 1m
  input_series:
  - series: up{job="scrim", instance="127.0.0.1:9792"}
    values: '0x10'
  - series: up{job="node", instance="10.0.0.1:9100"}
    values: '0x10'
  alert_rule_test:
  - eval_time: 1m
    alertname: ScrimDown
    exp_alerts: []
  - eval_time: 5m
    alertname: ScrimDown
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        severity: critical
      exp_annotations:
        summary: scrim metrics endpoint is not answering
        description: Prometheus cannot scrape scrim on 127.0.0.1:9792. The control plane is down or its metrics listener is unreachable.
        runbook_url: https://github.com/heliopsy/scrim/blob/main/docs/monitoring.md#scrimdown
- name: ScrimDown stays quiet while the target is up
  interval: 1m
  input_series:
  - series: up{job="scrim", instance="127.0.0.1:9792"}
    values: 1x10
  alert_rule_test:
  - eval_time: 5m
    alertname: ScrimDown
    exp_alerts: []
- name: ScrimDataPlaneDown fires after 1m down
  interval: 1m
  input_series:
  - series: scrim_dataplane_up{job="scrim", instance="127.0.0.1:9792"}
    values: 1 1 0 0 0 0
  alert_rule_test:
  - eval_time: 2m
    alertname: ScrimDataPlaneDown
    exp_alerts: []
  - eval_time: 5m
    alertname: ScrimDataPlaneDown
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        severity: critical
      exp_annotations:
        summary: scrim data plane is down
        description: The control plane on 127.0.0.1:9792 reports its data plane as not running. Provider traffic through this instance is refused.
        runbook_url: https://github.com/heliopsy/scrim/blob/main/docs/monitoring.md#scrimdataplanedown
- name: ScrimDataPlaneDown stays quiet while up
  interval: 1m
  input_series:
  - series: scrim_dataplane_up{job="scrim", instance="127.0.0.1:9792"}
    values: 1x10
  alert_rule_test:
  - eval_time: 5m
    alertname: ScrimDataPlaneDown
    exp_alerts: []
- name: ScrimDataPlaneRestarting fires on more than 2 restarts in 15m
  interval: 1m
  input_series:
  - series: scrim_dataplane_restarts_total{job="scrim", instance="127.0.0.1:9792"}
    values: 0+1x5 5x10
  alert_rule_test:
  - eval_time: 10m
    alertname: ScrimDataPlaneRestarting
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        severity: warning
      exp_annotations:
        summary: scrim data plane is restarting repeatedly
        description: The data plane on 127.0.0.1:9792 restarted more than twice in the last 15 minutes.
        runbook_url: https://github.com/heliopsy/scrim/blob/main/docs/monitoring.md#scrimdataplanerestarting
- name: ScrimDataPlaneRestarting ignores a single restart
  interval: 1m
  input_series:
  - series: scrim_dataplane_restarts_total{job="scrim", instance="127.0.0.1:9792"}
    values: 0 1x15
  alert_rule_test:
  - eval_time: 12m
    alertname: ScrimDataPlaneRestarting
    exp_alerts: []
- name: ScrimDataPlaneMetricsUnavailable fires after 5m
  interval: 1m
  input_series:
  - series: scrim_dataplane_metrics_up{job="scrim", instance="127.0.0.1:9792"}
    values: '0x10'
  alert_rule_test:
  - eval_time: 3m
    alertname: ScrimDataPlaneMetricsUnavailable
    exp_alerts: []
  - eval_time: 10m
    alertname: ScrimDataPlaneMetricsUnavailable
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        severity: warning
      exp_annotations:
        summary: scrim data plane metrics are missing
        description: The control plane on 127.0.0.1:9792 cannot read the data plane's own metrics. scrim_dataplane_* series are stale or absent.
        runbook_url: https://github.com/heliopsy/scrim/blob/main/docs/monitoring.md#scrimdataplanemetricsunavailable
- name: ScrimDataPlaneMetricsUnavailable stays quiet after recovery
  interval: 1m
  input_series:
  - series: scrim_dataplane_metrics_up{job="scrim", instance="127.0.0.1:9792"}
    values: 0 0 0 1x10
  alert_rule_test:
  - eval_time: 10m
    alertname: ScrimDataPlaneMetricsUnavailable
    exp_alerts: []
- name: ScrimGuardWithholdingSpike fires on many withheld
  interval: 1m
  input_series:
  - series: scrim_dataplane_guard_actions_total{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", source="llm", action="withheld"}
    values: 0+2x10
  alert_rule_test:
  - eval_time: 10m
    alertname: ScrimGuardWithholdingSpike
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        severity: warning
      exp_annotations:
        summary: scrim guard is withholding output
        description: The guard on 127.0.0.1:9792 withheld more than 5 responses or chunks in the last 10 minutes. The redactor is missing values the guard still catches.
        runbook_url: https://github.com/heliopsy/scrim/blob/main/docs/monitoring.md#scrimguardwithholdingspike
- name: ScrimGuardWithholdingSpike ignores repairs
  interval: 1m
  input_series:
  - series: scrim_dataplane_guard_actions_total{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", source="llm", action="withheld"}
    values: '0x10'
  - series: scrim_dataplane_guard_actions_total{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", source="llm", action="repaired"}
    values: 0+5x10
  alert_rule_test:
  - eval_time: 10m
    alertname: ScrimGuardWithholdingSpike
    exp_alerts: []
- name: ScrimRefusalRatioHigh fires at about 9% refused
  interval: 1m
  input_series:
  - series: scrim_dataplane_requests_total{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", outcome="forwarded"}
    values: 0+100x40
  - series: scrim_dataplane_requests_total{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", outcome="refused"}
    values: 0+10x40
  - series: scrim_dataplane_refusals_total{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", source="llm", code="guard_refused"}
    values: 0+10x40
  alert_rule_test:
  - eval_time: 5m
    alertname: ScrimRefusalRatioHigh
    exp_alerts: []
  - eval_time: 30m
    alertname: ScrimRefusalRatioHigh
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        severity: warning
      exp_annotations:
        summary: scrim refuses more than 5% of provider requests
        description: More than 5% of provider requests on 127.0.0.1:9792 were refused over the last 10 minutes. Check the refusal codes on the dashboard.
        runbook_url: https://github.com/heliopsy/scrim/blob/main/docs/monitoring.md#scrimrefusalratiohigh
- name: ScrimRefusalRatioHigh stays quiet at 1% and with no traffic
  interval: 1m
  input_series:
  - series: scrim_dataplane_requests_total{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", outcome="forwarded"}
    values: 0+100x40
  - series: scrim_dataplane_refusals_total{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", source="llm", code="guard_refused"}
    values: 0+1x40
  - series: scrim_dataplane_refusals_total{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", source="toolproxy", code="policy_denied"}
    values: 0+50x40
  - series: scrim_dataplane_requests_total{job="scrim", instance="10.0.0.2:9792", route="openai", provider="openai", outcome="forwarded"}
    values: '0x40'
  - series: scrim_dataplane_refusals_total{job="scrim", instance="10.0.0.2:9792", route="openai", provider="openai", source="llm", code="not_ready"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 30m
    alertname: ScrimRefusalRatioHigh
    exp_alerts: []
- name: ScrimRedactionLatencyOverBudget fires when p99 is above 5 ms
  interval: 1m
  input_series:
  - series: scrim_dataplane_request_added_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", stage="total", le="0.0025"}
    values: '0x40'
  - series: scrim_dataplane_request_added_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", stage="total", le="0.005"}
    values: 0+1x40
  - series: scrim_dataplane_request_added_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", stage="total", le="0.01"}
    values: 0+100x40
  - series: scrim_dataplane_request_added_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", stage="total", le="+Inf"}
    values: 0+100x40
  - series: scrim_dataplane_request_added_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", stage="redaction", le="0.0025"}
    values: 0+100x40
  - series: scrim_dataplane_request_added_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", stage="redaction", le="+Inf"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 10m
    alertname: ScrimRedactionLatencyOverBudget
    exp_alerts: []
  - eval_time: 30m
    alertname: ScrimRedactionLatencyOverBudget
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        route: anthropic
        severity: warning
      exp_annotations:
        summary: scrim request latency is over the 5 ms budget
        description: p99 added request latency on route anthropic at 127.0.0.1:9792 is above 5 ms, the budget for a 1 MB body with 1,000 secrets.
        runbook_url: https://github.com/heliopsy/scrim/blob/main/docs/monitoring.md#scrimredactionlatencyoverbudget
- name: ScrimRedactionLatencyOverBudget stays quiet under budget
  interval: 1m
  input_series:
  - series: scrim_dataplane_request_added_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", stage="total", le="0.001"}
    values: 0+100x40
  - series: scrim_dataplane_request_added_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", stage="total", le="0.0025"}
    values: 0+100x40
  - series: scrim_dataplane_request_added_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", stage="total", le="0.005"}
    values: 0+100x40
  - series: scrim_dataplane_request_added_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", stage="total", le="+Inf"}
    values: 0+100x40
  - series: scrim_dataplane_request_added_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", stage="guard", le="0.005"}
    values: '0x40'
  - series: scrim_dataplane_request_added_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", stage="guard", le="0.05"}
    values: 0+100x40
  - series: scrim_dataplane_request_added_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", stage="guard", le="+Inf"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 30m
    alertname: ScrimRedactionLatencyOverBudget
    exp_alerts: []
- name: ScrimRestoreChunkLatencyOverBudget fires when p99 is above 50 us
  interval: 1m
  input_series:
  - series: scrim_dataplane_restore_chunk_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", le="0.00005"}
    values: 0+1x40
  - series: scrim_dataplane_restore_chunk_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", le="0.0001"}
    values: 0+100x40
  - series: scrim_dataplane_restore_chunk_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", le="+Inf"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 30m
    alertname: ScrimRestoreChunkLatencyOverBudget
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        route: anthropic
        severity: warning
      exp_annotations:
        summary: scrim response restore latency is over the 50 us budget
        description: p99 time to restore one response chunk on route anthropic at 127.0.0.1:9792 is above 50 microseconds.
        runbook_url: https://github.com/heliopsy/scrim/blob/main/docs/monitoring.md#scrimrestorechunklatencyoverbudget
- name: ScrimRestoreChunkLatencyOverBudget stays quiet under budget
  interval: 1m
  input_series:
  - series: scrim_dataplane_restore_chunk_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", le="0.00001"}
    values: 0+100x40
  - series: scrim_dataplane_restore_chunk_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", le="0.00005"}
    values: 0+100x40
  - series: scrim_dataplane_restore_chunk_seconds_bucket{job="scrim", instance="127.0.0.1:9792", route="anthropic", provider="anthropic", le="+Inf"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 30m
    alertname: ScrimRestoreChunkLatencyOverBudget
    exp_alerts: []
- name: ScrimStoreDegraded fires after 5m
  interval: 1m
  input_series:
  - series: scrim_store_degraded{job="scrim", instance="127.0.0.1:9792", store="vault"}
    values: 1x10
  alert_rule_test:
  - eval_time: 10m
    alertname: ScrimStoreDegraded
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        store: vault
        severity: critical
      exp_annotations:
        summary: scrim secret store is degraded
        description: "Store vault on 127.0.0.1:9792 is degraded: its last refresh failed or a redact target holds no value. Secrets added or rotated there since the last good refresh are not redacted yet."
        runbook_url: https://github.com/heliopsy/scrim/blob/main/docs/monitoring.md#scrimstoredegraded
- name: ScrimStoreDegraded stays quiet after recovery
  interval: 1m
  input_series:
  - series: scrim_store_degraded{job="scrim", instance="127.0.0.1:9792", store="vault"}
    values: 1 1 0x10
  alert_rule_test:
  - eval_time: 10m
    alertname: ScrimStoreDegraded
    exp_alerts: []
- name: ScrimStoreUnreachable fires after 10m
  interval: 1m
  input_series:
  - series: scrim_store_up{job="scrim", instance="127.0.0.1:9792", store="vault"}
    values: '0x20'
  alert_rule_test:
  - eval_time: 5m
    alertname: ScrimStoreUnreachable
    exp_alerts: []
  - eval_time: 15m
    alertname: ScrimStoreUnreachable
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        store: vault
        severity: warning
      exp_annotations:
        summary: scrim secret store is unhealthy
        description: "Store vault on 127.0.0.1:9792 has been unhealthy for 10 minutes: not loaded, locked, or not refreshed within its refresh.staleness. scrim keeps redacting the last values it loaded."
        runbook_url: https://github.com/heliopsy/scrim/blob/main/docs/monitoring.md#scrimstoreunreachable
- name: ScrimStoreUnreachable stays quiet while up
  interval: 1m
  input_series:
  - series: scrim_store_up{job="scrim", instance="127.0.0.1:9792", store="vault"}
    values: 1x20
  alert_rule_test:
  - eval_time: 15m
    alertname: ScrimStoreUnreachable
    exp_alerts: []
- name: ScrimStoreStale fires over an hour stale
  interval: 1m
  input_series:
  - series: scrim_store_staleness_seconds{job="scrim", instance="127.0.0.1:9792", store="vault"}
    values: 4000+60x20
  alert_rule_test:
  - eval_time: 15m
    alertname: ScrimStoreStale
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        store: vault
        severity: warning
      exp_annotations:
        summary: scrim secret store values are stale
        description: Store vault on 127.0.0.1:9792 has not refreshed for more than an hour.
        runbook_url: https://github.com/heliopsy/scrim/blob/main/docs/monitoring.md#scrimstorestale
- name: ScrimStoreStale stays quiet when fresh
  interval: 1m
  input_series:
  - series: scrim_store_staleness_seconds{job="scrim", instance="127.0.0.1:9792", store="vault"}
    values: 60x20
  alert_rule_test:
  - eval_time: 15m
    alertname: ScrimStoreStale
    exp_alerts: []
- name: ScrimApprovalBacklog fires on a sustained queue
  interval: 1m
  input_series:
  - series: scrim_approvals_pending{job="scrim", instance="127.0.0.1:9792"}
    values: 20x30
  - series: scrim_approvals_oldest_pending_age_seconds{job="scrim", instance="127.0.0.1:9792"}
    values: 120x30
  alert_rule_test:
  - eval_time: 20m
    alertname: ScrimApprovalBacklog
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        severity: warning
      exp_annotations:
        summary: scrim approvals are backing up
        description: 'Approvals on 127.0.0.1:9792 are not being settled: more than 10 have been pending for 15 minutes, or the oldest has waited over 15 minutes.'
        runbook_url: https://github.com/heliopsy/scrim/blob/main/docs/monitoring.md#scrimapprovalbacklog
- name: ScrimApprovalBacklog fires on one old approval
  interval: 1m
  input_series:
  - series: scrim_approvals_pending{job="scrim", instance="127.0.0.1:9792"}
    values: 1x30
  - series: scrim_approvals_oldest_pending_age_seconds{job="scrim", instance="127.0.0.1:9792"}
    values: 1000+60x30
  alert_rule_test:
  - eval_time: 5m
    alertname: ScrimApprovalBacklog
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        severity: warning
      exp_annotations:
        summary: scrim approvals are backing up
        description: 'Approvals on 127.0.0.1:9792 are not being settled: more than 10 have been pending for 15 minutes, or the oldest has waited over 15 minutes.'
        runbook_url: https://github.com/heliopsy/scrim/blob/main/docs/monitoring.md#scrimapprovalbacklog
- name: ScrimApprovalBacklog ignores a short spike and young approvals
  interval: 1m
  input_series:
  - series: scrim_approvals_pending{job="scrim", instance="127.0.0.1:9792"}
    values: 20 20 20 2x30
  - series: scrim_approvals_oldest_pending_age_seconds{job="scrim", instance="127.0.0.1:9792"}
    values: 100x30
  alert_rule_test:
  - eval_time: 20m
    alertname: ScrimApprovalBacklog
    exp_alerts: []
- name: ScrimSnapshotPushFailing fires when every push fails
  interval: 1m
  input_series:
  - series: scrim_snapshot_pushes_total{job="scrim", instance="127.0.0.1:9792", result="error"}
    values: 0+1x30
  - series: scrim_snapshot_pushes_total{job="scrim", instance="127.0.0.1:9792", result="ok"}
    values: 3x30
  alert_rule_test:
  - eval_time: 20m
    alertname: ScrimSnapshotPushFailing
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        severity: critical
      exp_annotations:
        summary: scrim cannot push snapshots to the data plane
        description: Every snapshot push on 127.0.0.1:9792 failed in the last 15 minutes. The data plane runs on an old snapshot, so new values and policy are not enforced.
        runbook_url: https://github.com/heliopsy/scrim/blob/main/docs/monitoring.md#scrimsnapshotpushfailing
- name: ScrimSnapshotPushFailing stays quiet while some pushes succeed
  interval: 1m
  input_series:
  - series: scrim_snapshot_pushes_total{job="scrim", instance="127.0.0.1:9792", result="error"}
    values: 0+1x30
  - series: scrim_snapshot_pushes_total{job="scrim", instance="127.0.0.1:9792", result="ok"}
    values: 0+1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: ScrimSnapshotPushFailing
    exp_alerts: []
- name: ScrimConfigReloadRejected fires on a rejected reload
  interval: 1m
  input_series:
  - series: scrim_config_reloads_total{job="scrim", instance="127.0.0.1:9792", result="rejected"}
    values: 0 0 1x20
  alert_rule_test:
  - eval_time: 10m
    alertname: ScrimConfigReloadRejected
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        severity: warning
      exp_annotations:
        summary: scrim rejected a configuration reload
        description: A configuration reload on 127.0.0.1:9792 was rejected in the last 30 minutes. The previous configuration is still in force.
        runbook_url: https://github.com/heliopsy/scrim/blob/main/docs/monitoring.md#scrimconfigreloadrejected
- name: ScrimConfigReloadRejected ignores applied reloads
  interval: 1m
  input_series:
  - series: scrim_config_reloads_total{job="scrim", instance="127.0.0.1:9792", result="rejected"}
    values: '0x20'
  - series: scrim_config_reloads_total{job="scrim", instance="127.0.0.1:9792", result="applied"}
    values: 0+1x20
  alert_rule_test:
  - eval_time: 10m
    alertname: ScrimConfigReloadRejected
    exp_alerts: []
- name: ScrimAuditDropping fires on drops
  interval: 1m
  input_series:
  - series: scrim_audit_dropped_total{job="scrim", instance="127.0.0.1:9792", sink="webhook"}
    values: 0 0 3x20
  alert_rule_test:
  - eval_time: 10m
    alertname: ScrimAuditDropping
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        severity: warning
      exp_annotations:
        summary: scrim is dropping audit entries
        description: Data plane audit events on 127.0.0.1:9792 were dropped in the last 15 minutes, by the data plane or because the state backend could not write them.
        runbook_url: https://github.com/heliopsy/scrim/blob/main/docs/monitoring.md#scrimauditdropping
- name: ScrimAuditDropping ignores old drops
  interval: 1m
  input_series:
  - series: scrim_audit_dropped_total{job="scrim", instance="127.0.0.1:9792", sink="webhook"}
    values: 5x40
  alert_rule_test:
  - eval_time: 30m
    alertname: ScrimAuditDropping
    exp_alerts: []
- name: ScrimWeakenedSetting fires after an hour
  interval: 1m
  input_series:
  - series: scrim_config_weakened_settings{job="scrim", instance="127.0.0.1:9792", setting="guard.disabled"}
    values: 1x120
  alert_rule_test:
  - eval_time: 50m
    alertname: ScrimWeakenedSetting
    exp_alerts: []
  - eval_time: 90m
    alertname: ScrimWeakenedSetting
    exp_alerts:
    - exp_labels:
        job: scrim
        instance: 127.0.0.1:9792
        setting: guard.disabled
        severity: info
      exp_annotations:
