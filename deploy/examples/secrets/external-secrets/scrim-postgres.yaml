apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scrim-postgres
  namespace: scrim
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: scrim-postgres
    creationPolicy: Owner
  data:
    - secretKey: dsn
      remoteRef:
        key: scrim/postgres
        property: dsn
