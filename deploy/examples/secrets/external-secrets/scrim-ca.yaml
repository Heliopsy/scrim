# The interception CA, as a kubernetes.io/tls Secret with a PKCS#8 key.
# Store it once in OpenBao (tls.crt and tls.key fields of secret/scrim/ca).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scrim-ca
  namespace: scrim
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: scrim-ca
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: scrim/ca
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: scrim/ca
        property: tls.key
