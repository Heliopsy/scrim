# The placeholder key and approvals signing key every scrim replica shares.
# Generate them once into OpenBao, for example:
#   bao kv put secret/scrim/keys placeholder-k1="$(openssl rand -hex 32)" \
#     approvals-signing-key="$(openssl rand -hex 32)"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scrim-keys
  namespace: scrim
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: scrim-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: scrim/keys
