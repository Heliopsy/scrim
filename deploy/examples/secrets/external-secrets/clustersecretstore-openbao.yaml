# External Secrets Operator reads from OpenBao (the vault provider) with its
# own Kubernetes service account. It needs read access to secret/scrim/ only:
# the keys, CA and DSN scrim's pods mount. The agents' tokens are not here;
# scrim reads those from OpenBao itself, with its own identity.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://bao.example.com:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-scrim
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
