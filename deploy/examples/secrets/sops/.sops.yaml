# SOPS rules for the scrim Secrets in a fleet repository. Replace the age
# recipient with your own public key (age-keygen -y key.txt); the private key
# goes into the cluster as the Secret sops-age in flux-system, never into git.
# Only data and stringData are encrypted, so names and labels stay reviewable.
creation_rules:
  - path_regex: .*\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age12ykrs8umtswpnud5hfr4ylcu9rwd0dckjzpgrler3gz0fw4gqcsq7w27zl
