# secrets/<env>/ in a fleet repository: SOPS-encrypted Secrets that the Flux
# Kustomization scrim-secrets decrypts with the age key in flux-system/sops-age.
# The values here are encrypted placeholders whose key was thrown away; encrypt
# your own with `sops --encrypt --in-place <file>` after filling them in.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - scrim-keys.sops.yaml
  - scrim-postgres.sops.yaml
