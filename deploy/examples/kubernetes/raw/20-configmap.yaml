# The scrim config file. It is the same format as on a workstation; only the
# listeners, paths and the k8s profile differ. Secrets are files from Secret
# volumes, referenced with file: or read by the file store.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrim-config
  namespace: scrim
  labels:
    app.kubernetes.io/name: scrim
data:
  config.yaml: |
    apiVersion: scrim.dev/v1
    kind: Config

    profile: k8s

    stores:
      files:
        kind: file
        root: /run/secrets/scrim
        redact:
          - files://agents/*
        refresh:
          interval: 1m

    catalog:
      entries:
        github:
          ref: files://agents/github-token
          hosts: [api.github.com]
          placeholder: SCRIM_GITHUB_TOKEN
          inject: ["header:Authorization"]

    redaction:
      placeholder-keys:
        k1: {version: 1, key: "file:/run/secrets/scrim-keys/placeholder-k1"}

    approvals:
      signing-key: file:/run/secrets/scrim-keys/approvals-signing-key

    tool-proxy:
      ca:
        cert-file: /run/secrets/scrim-ca/tls.crt
        key: file:/run/secrets/scrim-ca/tls.key

    proxy:
      listen: 0.0.0.0:9790
      forward-listen: 0.0.0.0:9791

    metrics:
      listen: 0.0.0.0:9792

    # The k8s profile identifies agent pods by their service account tokens,
    # which needs scrim's own API token and a TokenReview binding. These
    # manifests have neither, so agent pods are unknown callers: redacted, never
    # injected for. The Helm chart wires identity.
    identity:
      kubernetes:
        enabled: false

    log:
      format: json
