# Agent pods in the agents namespace, labelled scrim.dev/agent: "true", reach
# only scrim and the cluster DNS. scrim accepts connections from them only.
# A NetworkPolicy works only where the CNI enforces it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agents-egress-scrim-only
  namespace: agents
spec:
  podSelector:
    matchLabels:
      scrim.dev/agent: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: scrim
          podSelector:
            matchLabels:
              app.kubernetes.io/name: scrim
      ports:
        - {protocol: TCP, port: 9790}
        - {protocol: TCP, port: 9791}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scrim-ingress-from-agents
  namespace: scrim
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: scrim
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agents
          podSelector:
            matchLabels:
              scrim.dev/agent: "true"
      ports:
        - {protocol: TCP, port: 9790}
        - {protocol: TCP, port: 9791}
