# staging: two replicas on PostgreSQL, NetworkPolicy on, the release that is
# about to go to prod.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../components/postgres
  - ../../components/networkpolicy
configMapGenerator:
  - name: scrim-config
    behavior: merge
    files:
      - overlay-env.yaml
replicas:
  - name: scrim
    count: 2
images:
  - name: ghcr.io/heliopsy/scrim
    newTag: 0.3.0 # x-release-please-version
