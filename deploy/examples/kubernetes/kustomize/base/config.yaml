apiVersion: scrim.dev/v1
kind: Config

profile: k8s

stores:
  files:
    kind: file
    root: /run/secrets/scrim
    redact:
      - files://agents/*
    refresh:
      interval: 1m

catalog:
  entries:
    github:
      ref: files://agents/github-token
      hosts: [api.github.com]
      placeholder: SCRIM_GITHUB_TOKEN
      inject: ["header:Authorization"]

redaction:
  placeholder-keys:
    k1: {version: 1, key: "file:/run/secrets/scrim-keys/placeholder-k1"}

approvals:
  signing-key: file:/run/secrets/scrim-keys/approvals-signing-key

tool-proxy:
  ca:
    cert-file: /run/secrets/scrim-ca/tls.crt
    key: file:/run/secrets/scrim-ca/tls.key

proxy:
  listen: 0.0.0.0:9790
  forward-listen: 0.0.0.0:9791

metrics:
  listen: 0.0.0.0:9792

log:
  format: json

# Overlays and components add overlay-*.yaml files to the ConfigMap; each is
# applied over this file, in name order. The glob may match nothing.
include:
  - overlay-*.yaml
