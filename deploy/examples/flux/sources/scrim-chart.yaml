# The scrim Helm chart as each release publishes it:
# oci://ghcr.io/heliopsy/charts/scrim, signed keyless by the release workflow.
# Flux refuses an unsigned artifact or one signed by another workflow. The
# spec is the chart's own deploy/helm/scrim/examples/flux/ocirepository.yaml;
# `just deploy-examples-check` fails when they differ.
#
# To read the chart from git instead, use scrim-chart-git.yaml and the
# commented chart.spec in helm/helmrelease.yaml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: scrim-chart
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/heliopsy/charts/scrim
  ref:
    # Any 1.x release; raise the bound deliberately for a new major. For a
    # pinned install use the exact tag and the digest from the GitHub release;
    # the digest wins.
    semver: ">=1.0.0 <2.0.0"
  # Only the chart layer, as the tarball helm-controller expects.
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/Heliopsy/scrim/\.github/workflows/release\.yaml@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+.*|heads/main)$
