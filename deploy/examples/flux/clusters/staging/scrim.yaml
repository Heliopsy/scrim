# Flux Kustomizations for the staging cluster, in your fleet repository under
# clusters/staging/ (the flux-system source). They expect it to hold:
#   scrim/             a copy of deploy/examples/kubernetes/kustomize
#   secrets/staging/   the SOPS-encrypted Secrets for this cluster
#   kyverno/           deploy/examples/kyverno (the image signature policy)
# The policy and the Secrets are applied first; scrim waits for both and for
# its own rollout.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: scrim-secrets
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./secrets/staging
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: scrim-policies
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kyverno
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: scrim
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: scrim-secrets
    - name: scrim-policies
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./scrim/overlays/staging
  prune: true
  wait: true
  timeout: 5m
