# For the Helm path instead of clusters/<env>/scrim.yaml's `scrim`: applies
# flux/helm/, copied to scrim-helm/ in your fleet repository, after the
# Secrets and the image signature policy. Put flux/sources/scrim-chart.yaml
# next to this file in clusters/<env>/, so bootstrap applies the chart source.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: scrim-helm
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: scrim-secrets
    - name: scrim-policies
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./scrim-helm
  prune: true
  wait: true
  timeout: 10m
