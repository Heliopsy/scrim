# /etc/systemd/system/scrim.service.d/openbao.conf
#
# Hands the OpenBao AppRole credentials to scrim as systemd credentials. The
# files stay root-only (mode 0600); scrim reads them as cred:bao-role-id and
# cred:bao-secret-id (config-openbao.yaml). systemd refuses to start the unit
# while either file is missing.
[Service]
LoadCredential=bao-role-id:/etc/scrim/credentials/bao-role-id
LoadCredential=bao-secret-id:/etc/scrim/credentials/bao-secret-id
