# Argo CD Image Updater 1.x: bumps the scrim image of the dev Application to
# the newest 0.x release and commits the change to the dev overlay in your
# fleet repository. staging and prod follow by pull request (or Renovate).
#
# Image Updater verifies cosign signatures only against a public key, and scrim
# is signed keyless, so the signature is checked at admission by the Kyverno
# policy (deploy/examples/kyverno/verify-scrim-images.yaml) instead.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: scrim-dev
  namespace: argocd
spec:
  writeBackConfig:
    method: git
    gitConfig:
      branch: main
      writeBackTarget: kustomization:/scrim/overlays/dev
  applicationRefs:
    - namePattern: scrim-dev
      images:
        - alias: scrim
          # The tag is the semver constraint: any 0.x release.
          imageName: ghcr.io/heliopsy/scrim:0.x
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: 'regexp:^0\.[0-9]+\.[0-9]+$'
          manifestTargets:
            kustomize:
              name: ghcr.io/heliopsy/scrim
