# deploy/examples/kyverno/ copied to kyverno/ in your fleet repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scrim-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: scrim
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/example-org/fleet
    targetRevision: main
    path: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
