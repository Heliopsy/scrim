# deploy/examples/secrets/external-secrets/ copied to secrets/external-secrets/
# in your fleet repository: the ClusterSecretStore and the ExternalSecrets that
# produce scrim-keys, scrim-ca and scrim-postgres. External Secrets Operator
# itself is installed like Kyverno.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scrim-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: scrim
  destination:
    server: https://kubernetes.default.svc
    namespace: scrim
  source:
    repoURL: https://github.com/example-org/fleet
    targetRevision: main
    path: secrets/external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
