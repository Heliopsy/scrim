# App of apps for one cluster. It syncs the argocd/ directory of your fleet
# repository, where the files below live, and Argo CD applies the children in
# sync-wave order, each healthy before the next wave starts:
#   -3  kyverno.yaml           Kyverno and its CRDs
#   -2  policies.yaml          the image signature policy (needs the CRDs)
#   -1  external-secrets.yaml  scrim's Secrets from OpenBao
#    0  application-helm.yaml  scrim itself
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scrim-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/example-org/fleet
    targetRevision: main
    path: argocd
    directory:
      include: "{kyverno,policies,external-secrets,application-helm,appproject,repository-scrim-charts}.yaml"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
