name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions: read-all

jobs:
  conventional:
    name: Conventional commit title
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      # release-please derives the version bump from commit types, so a
      # non-conventional squash-merge title would silently break versioning.
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f  # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
