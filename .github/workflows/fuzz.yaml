name: Fuzz

# Every fuzz target: the cargo-fuzz targets of dataplane/crates/*/fuzz
# (matcher engines, variants, guard, restore, shaped placeholders, AWS SigV4)
# and the Go fuzz tests (`func Fuzz...` under internal/). scripts/fuzz.sh
# finds them, so there is no list to keep in step here.
#
# - Pull request: 5 minutes on each target whose code the pull request changes
#   (a crate the fuzz crate builds, a package the Go test imports; every target
#   when this file or scripts/fuzz.sh changes).
# - Nightly: 1 hour on every target, one job each, then the corpus job pushes
#   the minimised corpus to the fuzz-corpus branch.
# - Dispatch: every target for the given time; the corpus is not pushed.
#
# Every run starts from the persistent corpus on the fuzz-corpus branch, then
# the seeds committed per target (fuzz/seeds/<target> for cargo-fuzz, f.Add
# for Go, both built from the repository's fixtures) and the committed
# findings (fuzz/regressions/<target>, testdata/fuzz/<FuzzName>). The corpus is
# fetched anonymously; when it cannot be, the run starts from the seeds with a
# warning. A finding fails the job and its reproducer is uploaded as an
# artifact (fuzz inputs are generated bytes, never secrets);
# docs/leak-assurance.md ("Fuzzing") says how a finding becomes a regression
# test.
#
# Only the corpus job has a write token, only on the nightly run from main, and
# it runs no build or test code: it checks the corpus artifacts the fuzzing
# jobs uploaded (known target paths, plain files, size limits) and commits
# them. The fuzzing jobs, which run build scripts and tests, hold a read-only
# token.
#
# Why not ClusterFuzzLite: its actions run gcr.io images by a mutable tag
# (:v1) that pinning the action's SHA does not pin, build with OSS-Fuzz's own
# Rust nightly and Go instead of the pins in scripts/fuzz.sh and go.mod, run Go
# fuzz tests through a converter that rewrites the _test.go files, need the
# GitHub token inside the container, and keep the corpus in artifacts that
# expire or in a repository reached with a personal access token. The release
# results (scripts/release/results.sh) would still need this script.
#
# GitHub-hosted: libFuzzer with AddressSanitizer needs no podman but does need
# the runner's full address space, which the ho-z10 pods do not promise, and
# ho-z10 measures the latency gate, which an hour of fuzzing would disturb.
# scripts/fuzz.sh pins the nightly toolchain by date (Renovate's
# custom.rust-nightly datasource, renovate.json), installed through rustup,
# which scripts/ci-setup-rust.sh provides, and cargo-fuzz as its release
# binary, checked by sha256. The release workflow fuzzes the commit it releases
# with the same script, from the same corpus.
on:
  pull_request:
    paths:
      - dataplane/**
      - internal/**
      - go.mod
      - go.sum
      - scripts/fuzz.sh
      - .github/workflows/fuzz.yaml
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "3600"

permissions: read-all

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      seconds: ${{ steps.plan.outputs.seconds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The pull request's base, to see what it changed.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Set up rustup
        if: github.event_name == 'pull_request'
        run: scripts/ci-setup-rust.sh
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          go-version-file: go.mod
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_SECONDS: ${{ inputs.seconds }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              targets=$(scripts/fuzz.sh targets "$(git merge-base "$BASE" HEAD)") seconds=300 ;;
            schedule) targets=$(scripts/fuzz.sh targets) seconds=3600 ;;
            *) targets=$(scripts/fuzz.sh targets) seconds=${INPUT_SECONDS:-3600} ;;
          esac
          [[ "$seconds" =~ ^[1-9][0-9]*$ ]] || { echo "::error::seconds must be a positive number"; exit 1; }
          jq -r '.[] | "\(.kind) \(.unit) \(.target)"' <<<"$targets"
          { echo "targets=$targets"; echo "seconds=$seconds"; } >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    # The fuzzing time plus the build, the corpus minimisation and the uploads.
    timeout-minutes: 100
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      KIND: ${{ matrix.kind }}
      UNIT: ${{ matrix.unit }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up rustup
        if: matrix.kind == 'rust'
        run: scripts/ci-setup-rust.sh
      - name: Nightly toolchain and cargo-fuzz
        if: matrix.kind == 'rust'
        run: |
          set -euo pipefail
          scripts/fuzz.sh tools "$RUNNER_TEMP/fuzz-tools"
          echo "$RUNNER_TEMP/fuzz-tools/bin" >> "$GITHUB_PATH"
          # AddressSanitizer's shadow memory does not fit the default 32-bit
          # mmap randomisation of Ubuntu 24.04 runners.
          sudo sysctl -w vm.mmap_rnd_bits=28
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        if: matrix.kind == 'go'
        with:
          go-version-file: go.mod
          # The build cache holds Go's fuzzing corpus, which comes from the
          # corpus branch instead.
          cache: false
      - name: Fetch the corpus
        run: |
          scripts/fuzz.sh corpus-fetch "$RUNNER_TEMP/fuzz-corpus"
          echo "FUZZ_CORPUS=$RUNNER_TEMP/fuzz-corpus" >> "$GITHUB_ENV"
      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ needs.plan.outputs.seconds }}
          ID: ${{ matrix.id }}
        run: scripts/fuzz.sh run "$KIND" "$UNIT" "$TARGET" "$SECONDS_PER_TARGET" "$RUNNER_TEMP/results/$ID.json"
      - name: Minimise the corpus
        if: github.event_name == 'schedule'
        run: scripts/fuzz.sh corpus-export "$KIND" "$UNIT" "$TARGET" "$RUNNER_TEMP/corpus-out"
      - name: Upload the corpus
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: corpus-${{ matrix.id }}
          path: ${{ runner.temp }}/corpus-out/
          if-no-files-found: error
          retention-days: 3
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-result-${{ matrix.id }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload the reproducer
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-finding-${{ matrix.id }}
          path: |
            dataplane/crates/${{ matrix.unit }}/fuzz/artifacts/
            ${{ matrix.unit }}/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

  corpus:
    name: Push the corpus
    needs: [plan, fuzz]
    # Every target that finished pushes its corpus, even when another one found
    # something; a target without an artifact keeps the corpus it had.
    if: >-
      always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
      && needs.plan.result == 'success' && needs.fuzz.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: fuzz-corpus-push
      cancel-in-progress: false
    steps:
      # Only scripts/fuzz.sh and the fuzz crates' manifests (for the target
      # list) are read; nothing is built or run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the corpus
        run: scripts/fuzz.sh corpus-fetch "$RUNNER_TEMP/fuzz-corpus"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: corpus-*
          path: ${{ runner.temp }}/corpus-new
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: fuzz-result-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - name: Push the corpus
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/corpus-new" "$RUNNER_TEMP/results"
          {
            echo "## Fuzzing corpus"
            echo
            scripts/fuzz.sh corpus-push "$RUNNER_TEMP/fuzz-corpus" "$RUNNER_TEMP/corpus-new" "$RUNNER_TEMP/results"
          } >> "$GITHUB_STEP_SUMMARY"
