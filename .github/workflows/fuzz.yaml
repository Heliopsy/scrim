name: Fuzz

# Every cargo-fuzz target in dataplane/crates/scrim-redact/fuzz (matcher
# engines, variants, guard, restore, shaped placeholders) and
# dataplane/crates/scrim-toolproxy/fuzz (AWS SigV4) for a fixed time budget: 60 s each on a
# pull request or push that touches the data plane, 15 min each in the weekly
# run. A finding fails the job and its reproducer is uploaded as an artifact
# (fuzz inputs are generated bytes, never secrets). Nothing is cached: every
# run starts from an empty corpus, so no input from an earlier run is kept,
# except the findings committed under fuzz/regressions/<target>, which each
# run reads first.
#
# GitHub-hosted: libFuzzer with AddressSanitizer needs no podman but does
# need the runner's full address space, which the ho-z10 pods do not promise.
# scripts/fuzz.sh pins the nightly toolchain by date (Renovate's
# custom.rust-nightly datasource, renovate.json), installed through rustup,
# which scripts/ci-setup-rust.sh provides, and cargo-fuzz as its release
# binary, checked by sha256. The release workflow fuzzes the commit it releases
# with the same script.
on:
  pull_request:
    paths:
      - dataplane/**
      - scripts/fuzz.sh
      - .github/workflows/fuzz.yaml
  push:
    branches: [main]
    paths:
      - dataplane/**
      - scripts/fuzz.sh
      - .github/workflows/fuzz.yaml
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "900"

permissions: read-all

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with the [[bin]] entries of each fuzz crate, and with
        # the results-fuzz job of release.yaml; the "Targets match" step fails
        # when they differ (expected: every target of that crate, sorted).
        include:
          - {crate: scrim-redact, target: engines, expected: engines guard restore shaped variants}
          - {crate: scrim-redact, target: variants, expected: engines guard restore shaped variants}
          - {crate: scrim-redact, target: guard, expected: engines guard restore shaped variants}
          - {crate: scrim-redact, target: restore, expected: engines guard restore shaped variants}
          - {crate: scrim-redact, target: shaped, expected: engines guard restore shaped variants}
          - {crate: scrim-toolproxy, target: sigv4, expected: sigv4}
    defaults:
      run:
        working-directory: dataplane/crates/${{ matrix.crate }}/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up rustup
        working-directory: .
        run: scripts/ci-setup-rust.sh
      - name: Nightly toolchain and cargo-fuzz
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/fuzz.sh" tools "$RUNNER_TEMP/fuzz-tools"
          echo "$RUNNER_TEMP/fuzz-tools/bin" >> "$GITHUB_PATH"
          # AddressSanitizer's shadow memory does not fit the default 32-bit
          # mmap randomisation of Ubuntu 24.04 runners.
          sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Targets match
        env:
          CRATE: ${{ matrix.crate }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          set -euo pipefail
          got=$("$GITHUB_WORKSPACE/scripts/fuzz.sh" list "$CRATE")
          echo "$got"
          [ "$got" = "$EXPECTED" ] || {
            echo "::error::the fuzz targets changed; update the matrix in fuzz.yaml and release.yaml"; exit 1; }
      - name: Fuzz
        env:
          CRATE: ${{ matrix.crate }}
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '900' || inputs.seconds || '60' }}
        run: '"$GITHUB_WORKSPACE/scripts/fuzz.sh" run "$CRATE" "$TARGET" "$SECONDS_PER_TARGET"'
      - name: Upload the reproducer
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: dataplane/crates/${{ matrix.crate }}/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30
