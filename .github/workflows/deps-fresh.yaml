name: Dependency freshness

# The deps-fresh job of ci.yaml on a schedule: a new major release of a
# dependency appears without any change here, so a quiet week would otherwise
# never notice it. A failed run is the signal; fix it with an upgrade, or a
# dated, explained entry in .deps-fresh-ignore.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  deps-fresh:
    name: Dependencies on their latest major
    runs-on: ho-z10
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
      - run: scripts/deps-fresh.sh
