name: CI

# Where the jobs run:
#
# - ho-z10 is the Heliopsy ARC runner scale set. Each job gets its own
#   ephemeral pod (with its own network namespace) that is deleted when the job
#   ends, so nothing a job leaves behind reaches the next one. The pods have no
#   podman. They are matched by the scale set name alone: `[self-hosted,
#   ho-z10]` is never picked up. The pod image's own Go, Rust and just are not
#   relied on: every job installs the versions go.mod,
#   dataplane/rust-toolchain.toml and the pins below name.
# - Jobs that need podman stay on GitHub-hosted runners.
#
# Pull requests from forks wait for a maintainer's approval before any job
# runs (repository setting). No job here has a secret or an OIDC token, and the
# token is read-only.
on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

# A new push to a pull request cancels the run for the previous one; pushes to
# main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  go:
    name: Go
    runs-on: ho-z10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.15.0
      # Container-backed store tests run in their own job below.
      - run: go test -race -count=1 ./...
        env:
          SCRIM_TEST_PODMAN: "0"

  # GitHub-hosted: the store adapters are tested against real OpenBao,
  # Infisical and Vaultwarden containers, and the ho-z10 pods have no podman.
  # Every container is published on a free port and named scrim-stores-*.
  stores:
    name: Store conformance (podman)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
      - run: podman version
      # SCRIM_TEST_PODMAN=1 turns a missing or broken podman into a failure,
      # so the conformance runs cannot be skipped silently.
      - run: go test -race -count=1 -timeout 25m ./internal/stores/...
        env:
          SCRIM_TEST_PODMAN: "1"
      - name: Remove leftover containers
        if: always()
        run: |
          podman ps -a --filter name=scrim-stores- --format '{{.Names}}'
          podman pod ps --filter name=scrim-stores- --format '{{.Name}}'
          podman ps -aq --filter name=scrim-stores- | xargs -r podman rm -f -v
          podman pod ps -q --filter name=scrim-stores- | xargs -r podman pod rm -f
          podman volume prune -f

  rust:
    name: Rust
    runs-on: ho-z10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dataplane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      # rust-toolchain.toml pins the toolchain; rustup installs it.
      - run: rustup toolchain install && cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: dataplane
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # ntfy as its release binary, not as a container: the ho-z10 pods have no
  # podman. It listens on a free port picked at run time, never a fixed one.

  macos:
    name: macOS build
    # The release ships darwin binaries; this catches Linux-only code (for
    # example a rustix call that exists only on Linux) before a release does.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
      - name: Rust toolchain
        working-directory: dataplane
        run: rustup toolchain install
      - name: Data plane check
        working-directory: dataplane
        run: cargo check --locked --workspace --all-targets
      - name: Control plane build and vet
        run: go build ./... && go vet ./...

  ntfy-e2e:
    name: ntfy end-to-end
    runs-on: ho-z10
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=binwiederhier/ntfy extractVersion=^v(?<version>.+)$
      NTFY_VERSION: 2.38.1
      # sha256: https://github.com/binwiederhier/ntfy/releases/download/v{version}/ntfy_{version}_linux_amd64.tar.gz
      NTFY_LINUX_AMD64_SHA256: 9727d45e5da86c3f338f0f329044485bddde76f3fbbbc3f9e695c14776f09c32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install ntfy
        run: |
          set -euo pipefail
          tarball="ntfy_${NTFY_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/binwiederhier/ntfy/releases/download/v${NTFY_VERSION}/$tarball"
          echo "$NTFY_LINUX_AMD64_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" --strip-components=1 \
            "ntfy_${NTFY_VERSION}_linux_amd64/ntfy"
      - name: Approve and deny through a local ntfy
        run: |
          set -euo pipefail
          port=$(python3 -I -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          "$RUNNER_TEMP/ntfy" serve --listen-http "127.0.0.1:$port" >"$RUNNER_TEMP/ntfy.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/ntfy.pid"
          for _ in $(seq 50); do curl -fsS "http://127.0.0.1:$port/v1/health" && break; sleep 0.2; done
          SCRIM_TEST_NTFY_URL="http://127.0.0.1:$port" \
            go test -race -count=1 -run TestEndToEndAgainstNtfy -v ./internal/notify/ntfy/
      - name: Stop ntfy
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ntfy.pid" ]; then kill "$(cat "$RUNNER_TEMP/ntfy.pid")" 2>/dev/null || true; fi
          cat "$RUNNER_TEMP/ntfy.log" 2>/dev/null || true

  llm-latency-gate:
    name: LLM proxy latency gate
    runs-on: ho-z10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dataplane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: rustup toolchain install && cargo --version
      # Fails, naming the measurement, when a p99 exceeds crates/scrim-llm/benches/budget.json.
      - run: cargo bench --locked -p scrim-llm --bench latency_gate

  integration:
    name: Boundary integration
    runs-on: ho-z10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
      - run: rustup toolchain install && cargo --version
        working-directory: dataplane
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: dataplane
          save-if: false
      - run: cargo build --locked -p scrim-dataplane
        working-directory: dataplane
      - name: Launch the real data plane from Go, the daemon end to end and scrim run
        run: go test -race -count=1 -run 'TestRealDataPlane|TestEndToEndRealDataPlane|TestRunPrintEnvWithRealDaemon' -v ./internal/dataplane/ ./internal/daemon/ ./internal/cli/
        env:
          SCRIM_TEST_DATAPLANE: ${{ github.workspace }}/dataplane/target/debug/scrim-dataplane

  # The chart's gate, deploy/helm/scrim/ci/verify.sh, on Helm 3 (what Flux's
  # helm-controller and many clusters still run) and Helm 4: generated files,
  # lint, kubeconform with CRDs, Pod Security, promtool, helm-unittest, the
  # golden tests, the upgrade check, helm package. Then ct lint. Tools come
  # from ci/tools.sh, pinned by version and sha256.
  chart:
    name: Helm chart (helm ${{ matrix.helm }})
    runs-on: ho-z10
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        helm: ["3", "4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # golden.sh builds scrim to validate every configuration the chart renders.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"
      - name: Install tools
        env:
          HELM_MAJOR: ${{ matrix.helm }}
        run: |
          set -euo pipefail
          deploy/helm/scrim/ci/tools.sh "$RUNNER_TEMP/tools" "$HELM_MAJOR" > "$RUNNER_TEMP/tools.env"
          eval "$(tail -n1 "$RUNNER_TEMP/tools.env")"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          { echo "HELM_PLUGINS=$HELM_PLUGINS"; echo "CT_ETC=$CT_ETC"; } >> "$GITHUB_ENV"
          # PyYAML for the generators and checks, yamale and yamllint for ct lint.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml==6.0.4 yamale==6.1.0 yamllint==1.38.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: verify.sh
        run: deploy/helm/scrim/ci/verify.sh
      - name: ct lint
        run: |
          ct lint --config deploy/helm/scrim/ci/ct.yaml --charts deploy/helm/scrim \
            --chart-yaml-schema "$CT_ETC/chart_schema.yaml" --lint-conf "$CT_ETC/lintconf.yaml"

  # ct install (and, once a release has the chart, an upgrade from it) on kind,
  # with the scrim image built from this commit. GitHub-hosted: the ho-z10 pods
  # have no container runtime. The image is built with podman; kind runs its
  # node on the runner's Docker, the runtime GitHub's runners provide for it.
  chart-kind:
    name: Helm chart on kind (ct install)
    needs: chart
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
      - name: Set up rustup
        run: scripts/ci-setup-rust.sh
      - name: Install musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools
      - name: Build the scrim image
        env:
          SCRIM_RELEASE_NO_AUDITABLE: "1"
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/linux-amd64" "$stage/state"
          scripts/release/dataplane.sh linux-amd64 "$RUNNER_TEMP/scrim-dataplane"
          scripts/release/controlplane.sh linux-amd64 "$RUNNER_TEMP/scrim-dataplane" "$stage/linux-amd64/scrim"
          image="localhost/scrim-chart-ci:${GITHUB_SHA::12}"
          podman build -q --platform linux/amd64 -f Containerfile -t "$image" "$stage" >/dev/null
          podman save -q -o "$RUNNER_TEMP/scrim-image.tar" "$image"
          { echo "SCRIM_IMAGE=$image"; echo "SCRIM_IMAGE_ARCHIVE=$RUNNER_TEMP/scrim-image.tar"; } >> "$GITHUB_ENV"
          rm -rf "$CARGO_TARGET_DIR"
      - name: Install tools
        run: |
          set -euo pipefail
          deploy/helm/scrim/ci/tools.sh "$RUNNER_TEMP/tools" 3 >/dev/null
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: kind-test.sh
        env:
          KIND_PROVIDER: docker
        run: deploy/helm/scrim/ci/kind-test.sh
      - name: Remove the image
        if: always()
        run: podman rmi -f "${SCRIM_IMAGE:-none}" >/dev/null 2>&1 || true

  # GitHub-hosted: test/e2e/sandbox.sh needs unprivileged user and network
  # namespaces, which the ho-z10 pods do not allow. Real curl, git (with git
  # http-backend behind TLS), Node.js fetch and Python requests under
  # `scrim run` against a real `scrim proxy` (tasks.md 10.2); the network
  # namespace has loopback only, so nothing leaves the runner.
  e2e-tools:
    name: Tool clients end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
      # NODE_USE_ENV_PROXY needs Node.js 24 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
      - run: rustup toolchain install && cargo --version
        working-directory: dataplane
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: dataplane
          save-if: false
      - name: Allow unprivileged user namespaces and install Python requests
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 -c 'import requests' 2>/dev/null || sudo apt-get install -y --no-install-recommends python3-requests
          curl --version | head -1; git --version; node --version; python3 -c 'import requests; print("requests", requests.__version__)'
      # SCRIM_E2E_REQUIRE_TOOLS turns a missing client into a failure.
      - run: test/e2e/run.sh tools
        env:
          SCRIM_E2E_REQUIRE_TOOLS: "1"

  proto:
    name: Generated code up to date
    runs-on: ho-z10
    permissions:
      contents: read
    env:
      # The committed Go code names this protoc in its header. Upstream
      # publishes no checksums; this is the sha256 of the release asset.
      # renovate: datasource=github-releases depName=protocolbuffers/protobuf extractVersion=^v(?<version>.+)$
      PROTOC_VERSION: "36.2"
      # sha256: https://github.com/protocolbuffers/protobuf/releases/download/v{version}/protoc-{version}-linux-x86_64.zip
      PROTOC_LINUX_X86_64_SHA256: 121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-just
      - name: Install protoc
        run: |
          set -euo pipefail
          zip="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/$zip"
          echo "$PROTOC_LINUX_X86_64_SHA256  $RUNNER_TEMP/$zip" | sha256sum -c -
          python3 -I -m zipfile -e "$RUNNER_TEMP/$zip" "$RUNNER_TEMP/protoc"
          chmod 0755 "$RUNNER_TEMP/protoc/bin/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/protoc/bin/protoc" --version
      - run: rustup toolchain install && cargo --version
        working-directory: dataplane
      - run: just proto-check

  security:
    name: Vulnerabilities, licences and secrets
    runs-on: ho-z10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      # The release binary rather than EmbarkStudios/cargo-deny-action, which
      # is a Docker container action and cannot run on the ho-z10 pods.
      - name: cargo-deny
        env:
          # renovate: datasource=github-releases depName=EmbarkStudios/cargo-deny
          CARGO_DENY_VERSION: 0.22.0
          # sha256: https://github.com/EmbarkStudios/cargo-deny/releases/download/{version}/cargo-deny-{version}-x86_64-unknown-linux-musl.tar.gz
          CARGO_DENY_SHA256: 98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP" "$name/cargo-deny"
          cd dataplane
          rustup toolchain install
          "$RUNNER_TEMP/$name/cargo-deny" check advisories licenses bans sources
      # History reachable from the commit under test; without --log-opts
      # gitleaks scans every fetched branch, including unmerged ones.
      - name: gitleaks
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
          GITLEAKS_VERSION: 8.30.1
          # sha256: https://github.com/gitleaks/gitleaks/releases/download/v{version}/gitleaks_{version}_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --config .gitleaks.toml --log-opts=HEAD .

  # Fails when a direct Go or Rust dependency is behind its latest stable
  # major (0.x minor before 1.0): agents and people pick versions from memory,
  # and Dependabot only moves within the line a manifest names. The same check
  # runs weekly from deps-fresh.yaml, because a new major appears without a
  # code change. The checker, scripts/depsfresh, is standard-library Go built
  # with the toolchain go.mod pins (no other tool is downloaded) and talks to
  # proxy.golang.org and index.crates.io only. Exceptions: .deps-fresh-ignore.
  deps-fresh:
    name: Dependencies on their latest major
    runs-on: ho-z10
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
      - run: scripts/deps-fresh.sh

  # Alert rules (promtool check and unit tests), Prometheus configs, the
  # PrometheusRule and dashboard ConfigMap staying in sync with their sources.
  # promtool is the pinned release the script verifies by sha256. A
  # GitHub-hosted runner: it ships python3 with PyYAML.
  monitoring:
    name: Monitoring assets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: PyYAML
        run: python3 -I -c 'import yaml' || { sudo apt-get update -q && sudo apt-get install -yq python3-yaml; }
      - run: scripts/monitoring-check.sh

  # The files it checks are set in .markdownlint-cli2.yaml, the rules in
  # .markdownlint.yaml; `just md` runs the same thing locally.
  markdown:
    name: Markdown
    runs-on: ho-z10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
      - uses: ./.github/actions/setup-just
      - run: just md
