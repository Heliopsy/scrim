name: release-please

on:
  push:
    branches: [main]

permissions: read-all

jobs:
  release-please:
    name: Release pull request and tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A tag created with GITHUB_TOKEN starts no workflow, so the release
      # build is dispatched explicitly.
      - name: Start the release build
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yaml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"

      # The release pull request. release-please bumps every version marker
      # itself (docs/helm-values.md included) and the chart goldens render at a
      # fixed version, so a version bump leaves no generated file stale. The
      # generators run here anyway and push anything they change to the
      # release branch, so the pull request never needs a hand commit.
      - name: Check out the release pull request
        if: steps.release.outputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.release.outputs.pr
        with:
          python-version: "3.15"
      - name: Regenerate the chart's generated files
        if: steps.release.outputs.pr
        run: |
          set -euo pipefail
          deploy/helm/scrim/ci/tools.sh "$RUNNER_TEMP/tools" > "$RUNNER_TEMP/tools.env"
          eval "$(tail -n1 "$RUNNER_TEMP/tools.env")"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml==6.0.4
          PATH="$RUNNER_TEMP/venv/bin:$PATH" OUT="$RUNNER_TEMP/verify" deploy/helm/scrim/ci/verify.sh --generate-only
      - name: Push regenerated files to the release branch
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "generated files are current"
            exit 0
          fi
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qam 'chore: regenerate generated files for the release'
          # The token goes in a header for this one command; the checkout kept
          # no credentials.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$BRANCH"

      # A pull request opened or updated with GITHUB_TOKEN, and a push made
      # with it, start no workflow, so CI never ran on the release pull
      # request. workflow_dispatch is the one event GITHUB_TOKEN may start:
      # dispatch the pull request workflows on the release branch, whose head
      # now holds any regenerated files. Their checks land on that commit and
      # show on the pull request. This needs only the actions: write the job
      # already has. A GitHub App token would also start the
      # pull_request_target workflows (title, CLA), which do not apply to the
      # bot's pull request, at the cost of a long-lived private key in the
      # repository secrets.
      - name: Run CI on the release pull request
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          for wf in ci.yaml leak.yaml openspec.yaml deploy-examples.yaml; do
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          done
