name: release-please

on:
  push:
    branches: [main]

permissions: read-all

jobs:
  release-please:
    name: Release pull request and tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A tag created with GITHUB_TOKEN starts no workflow, so the release
      # build is dispatched explicitly.
      - name: Start the release build
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yaml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
