name: Leak suite

on:
  # The release-please workflow dispatches this on the release pull request,
  # which GITHUB_TOKEN opened and so started no pull_request run.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: leak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  leak:
    name: Leak suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod

      # The checker, fake provider, bypass matrix and scenarios against the
      # pass-through stand-in (every row must leak) and the naive stand-in
      # (exactly the verbatim rows are redacted).
      - name: Self-test
        run: go test -race -count=1 ./internal/leak/... ./internal/testing/fakeprovider/...

      - name: The gate fails against a pass-through proxy
        run: |
          if go run . audit run --proxy builtin:passthrough -q --report passthrough-report.json > passthrough.txt; then
            echo "scrim audit run passed against a pass-through proxy" >&2
            exit 1
          fi
          tail -n 1 passthrough.txt

      - run: rustup toolchain install
        working-directory: dataplane
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: dataplane
          save-if: false
      - run: cargo build --locked -p scrim-dataplane
        working-directory: dataplane

      # Gate against the real proxy: test/leak/start-proxy.sh runs
      # `scrim proxy` with the seeds in a file store.
      - name: Gate against scrim proxy
        env:
          SCRIM_DATAPLANE_PATH: ${{ github.workspace }}/dataplane/target/debug/scrim-dataplane
        run: |
          go run . audit run --proxy http://127.0.0.1:18484 --proxy-cmd test/leak/start-proxy.sh \
            --route anthropic-messages=/anthropic --route openai-chat=/openai --route openai-responses=/openai \
            --upstream-listen 127.0.0.1:18089 --report leak-report.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: leak-reports
          path: "*-report.json"
          if-no-files-found: ignore
          retention-days: 30
