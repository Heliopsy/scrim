name: Leak suite

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: leak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  leak:
    name: Leak suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      # The checker, fake provider, bypass matrix and scenarios against the
      # pass-through stand-in (every row must leak) and the naive stand-in
      # (exactly the verbatim rows are redacted).
      - name: Self-test
        run: go test -race -count=1 ./internal/leak/... ./internal/testing/fakeprovider/...

      - name: The gate fails against a pass-through proxy
        run: |
          if go run . audit run --proxy builtin:passthrough -q --report passthrough-report.json > passthrough.txt; then
            echo "scrim audit run passed against a pass-through proxy" >&2
            exit 1
          fi
          tail -n 1 passthrough.txt

      # Gate against the real proxy. Until `scrim proxy` serves traffic
      # (tasks.md 3.1) there is nothing to gate; the step says so instead of
      # passing silently.
      - name: Gate against scrim proxy
        run: |
          if go run . proxy --help 2>&1 | grep -q "not implemented"; then
            echo "::notice::scrim proxy is not implemented yet (tasks.md 3.1); leak gate against the real proxy skipped"
            exit 0
          fi
          test -x test/leak/start-proxy.sh || { echo "test/leak/start-proxy.sh missing" >&2; exit 1; }
          go run . audit run --proxy http://127.0.0.1:18484 --proxy-cmd test/leak/start-proxy.sh \
            --upstream-listen 127.0.0.1:18089 --report leak-report.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: leak-reports
          path: "*-report.json"
          if-no-files-found: ignore
          retention-days: 30
