# Dependabot keeps the Go modules, the Cargo manifests and the workflow
# actions (SHA pins with a version comment). Everything else, container
# images included, is Renovate's (renovate.json); no file is managed by both.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: cargo
    directories: [/dataplane, /dataplane/tools/protogen]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
