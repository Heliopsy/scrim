# gitleaks configuration for scrim.
#
# The default ruleset is kept in full. Each allowlist below records findings
# that are deliberately not secrets and says why, confined by path and by the
# shape of the match, so a real credential in the same file is still reported.

[extend]
useDefault = true

[[allowlists]]
description = """
Fake tokens in leak tests. A leak test seeds a value shaped like a real
credential and checks it never reaches a database, log or response. The values
carry the marker LEAKTEST so they cannot be mistaken for, or be, real tokens.
"""
paths = ['''_test\.go$''']
matchCondition = "AND"
regexTarget = "line"
regexes = ['''LEAKTEST''']

[[allowlists]]
description = """
SHA-256 digests of the redact-bench fixture files. They pin the fixture
content; a digest is not a credential.
"""
paths = ['''^bench/redact-bench/fixtures/manifest\.sha256\.json$''']
matchCondition = "AND"
regexTarget = "line"
regexes = ['''": "[0-9a-f]{64}",?$''']

[[allowlists]]
description = """
The redact-bench fixture generator writes a PEM header around random bytes it
generates at run time. The literal header is not a key.
"""
paths = ['''^bench/redact-bench/fixtures/gen/secrets\.go$''']
matchCondition = "AND"
regexTarget = "line"
regexes = ['''-----BEGIN PRIVATE KEY-----''']

[[allowlists]]
description = """
Descriptions of the HMAC constructions behind placeholders and approval
tokens. The formulas name the key; they do not contain one.
"""
paths = [
  '''^openspec/changes/scrim-v1/specs/redaction/spec\.md$''',
  '''^dataplane/crates/scrim-redact/src/placeholder\.rs$''',
  '''^internal/approval/token\.go$''',
]
matchCondition = "AND"
regexTarget = "line"
regexes = ['''HMAC-SHA256\(key''', '''"scrim-approval-v1\.''']

[[allowlists]]
description = """
Detector tests in the redaction core: AWS's documented example-shaped key id
and a truncated, escaped PEM block, which the fallback detectors must find.
"""
paths = ['''^dataplane/crates/scrim-redact/src/detect\.rs$''']
matchCondition = "AND"
regexTarget = "line"
regexes = ['''AKIAABCDEFGHIJKLMNOP''', '''BEGIN RSA PRIVATE KEY-----\\\\nMIIEow==''']

[[allowlists]]
description = """
Recorded OpenAI request fixtures carry Codex's prompt_cache_key, a UUID that
groups requests for prompt caching; it grants nothing.
"""
paths = ['''^dataplane/crates/scrim-llm/tests/fixtures/''']
matchCondition = "AND"
regexTarget = "line"
regexes = ['''"prompt_cache_key":"[0-9a-f-]{36}"''']
