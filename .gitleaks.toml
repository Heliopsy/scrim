# gitleaks configuration for scrim.
#
# The default ruleset is kept in full. Each allowlist below records findings
# that are deliberately not secrets and says why, confined by path and by the
# shape of the match, so a real credential in the same file is still reported.

[extend]
useDefault = true

[[allowlists]]
description = """
Fake tokens in leak tests. A leak test seeds a value shaped like a real
credential and checks it never reaches a database, log or response. The values
carry the marker LEAKTEST so they cannot be mistaken for, or be, real tokens.
"""
paths = ['''_test\.go$''']
matchCondition = "AND"
regexTarget = "line"
regexes = ['''LEAKTEST''']

[[allowlists]]
description = """
SHA-256 digests of the redact-bench fixture files. They pin the fixture
content; a digest is not a credential.
"""
paths = ['''^bench/redact-bench/fixtures/manifest\.sha256\.json$''']
matchCondition = "AND"
regexTarget = "line"
regexes = ['''": "[0-9a-f]{64}",?$''']

[[allowlists]]
description = """
The redact-bench fixture generator writes a PEM header around random bytes it
generates at run time. The literal header is not a key.
"""
paths = ['''^bench/redact-bench/fixtures/gen/secrets\.go$''']
matchCondition = "AND"
regexTarget = "line"
regexes = ['''-----BEGIN PRIVATE KEY-----''']

[[allowlists]]
description = """
Descriptions of the HMAC constructions behind placeholders and approval
tokens. The formulas name the key; they do not contain one.
"""
paths = [
  '''^openspec/changes/scrim-v1/specs/redaction/spec\.md$''',
  '''^dataplane/crates/scrim-redact/src/placeholder\.rs$''',
  '''^internal/approval/token\.go$''',
]
matchCondition = "AND"
regexTarget = "line"
regexes = ['''HMAC-SHA256\(key''', '''"scrim-approval-v1\.''']

[[allowlists]]
description = """
Detector tests in the redaction core: AWS's documented example-shaped key id
and a truncated, escaped PEM block, which the fallback detectors must find.
"""
paths = ['''^dataplane/crates/scrim-redact/src/detect\.rs$''']
matchCondition = "AND"
regexTarget = "line"
regexes = ['''AKIAABCDEFGHIJKLMNOP''', '''BEGIN RSA PRIVATE KEY-----\\\\nMIIEow==''']

[[allowlists]]
description = """
Recorded OpenAI request fixtures carry Codex's prompt_cache_key, a UUID that
groups requests for prompt caching; it grants nothing.
"""
paths = ['''^dataplane/crates/scrim-llm/tests/fixtures/''']
matchCondition = "AND"
regexTarget = "line"
regexes = ['''"prompt_cache_key":"[0-9a-f-]{36}"''']

[[allowlists]]
description = """
The sample Sec-WebSocket-Key from RFC 6455 section 1.3 (base64 of "the sample
nonce"), used by the tests that check WebSocket upgrades are refused. It is a
public example value, not a credential.
"""
paths = [
  '''^dataplane/crates/scrim-llm/tests/upgrade\.rs$''',
  '''^dataplane/crates/scrim-llm/tests/forward_proxy\.rs$''',
]
matchCondition = "AND"
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']

[[allowlists]]
description = """
Environment variable names in the generated systemd unit. SCRIM_API_SOCKET
names the agent API socket path; it is a path, not a key.
"""
paths = ['''^internal/install/units\.go$''']
matchCondition = "AND"
regexes = ['''"SCRIM_API_SOCKET=" \+ SystemRuntimeDir''']

[[allowlists]]
description = """
The Kubernetes end-to-end test sends placeholders and made-up keys on curl
command lines: the agent's placeholder SCRIM_TOOL_TOKEN (which scrim replaces
with a value it generates at run time) and the provider key agent-own-key.
Neither is a credential.
"""
paths = ['''^test/k8s/e2e\.sh$''']
matchCondition = "AND"
regexTarget = "line"
regexes = ['''Authorization: Bearer SCRIM_TOOL_TOKEN''', '''x-api-key: agent-own-key''']

[[allowlists]]
description = """
The canary request of the deployment guides sends an invalid API key on
purpose, so Anthropic answers 401 and the capture can be checked without an
account. The value is the literal string not-a-real-key.
"""
paths = ['''^docs/deploy/.*\.md$''', '''^scripts/deploy-examples/smoke\.sh$''']
matchCondition = "AND"
regexTarget = "line"
regexes = ['''x-api-key: not-a-real-key''']

[[allowlists]]
description = """
Placeholders in the deployment examples: the base64 of REPLACE-ME in a Secret
template, and the name of the data key that holds the placeholder key in a
Helm values file (the value is a key name, not key material).
"""
paths = ['''^deploy/examples/''']
matchCondition = "AND"
regexTarget = "line"
regexes = ['''UkVQTEFDRS1NRQ==''', '''^\s+key: placeholder-k1$''']

[[allowlists]]
description = """
Format-preserving placeholders and their test values. A shaped placeholder is
built to look like the token it stands for (ghp_ and 36 characters, AKIA and
16, a JWT), so the redaction core's tests, the tool proxy's SigV4 tests and the
vectors shared with the control plane are full of token-shaped strings. Test
values carry the marker TeSt, TEST or PLACEHOLDER, or are AWS's documented
EXAMPLE keys; every line of the vector file is one generated vector.
"""
paths = [
  '''^dataplane/crates/scrim-redact/src/shape\.rs$''',
  '''^dataplane/crates/scrim-redact/tests/shaped\.rs$''',
  '''^dataplane/crates/scrim-toolproxy/tests/sigv4\.rs$''',
]
matchCondition = "AND"
regexTarget = "line"
regexes = ['''TeSt|TEST|PLACEHOLDER|EXAMPLE''']

[[allowlists]]
description = """
The shaped placeholder vectors the Rust and Go implementations both check:
one generated vector per line, test values with the TeSt marker and the
placeholders derived from them.
"""
paths = ['''^internal/placeholder/testdata/shaped\.json$''']
matchCondition = "AND"
regexTarget = "line"
regexes = ['''^\s*\{"key_version": [0-9]+, "key_hex": "[0-9a-f]+", ''']

[[allowlists]]
description = """
AWS's SigV4 signing test suite (Apache-2.0, see its NOTICE): the published
example session token in signed requests.
"""
paths = ['''^dataplane/crates/scrim-toolproxy/testdata/aws-sigv4-test-suite/''']
matchCondition = "AND"
regexTarget = "line"
regexes = ['''(?i)x-amz-security-token''']
